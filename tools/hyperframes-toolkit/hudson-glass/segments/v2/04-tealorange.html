<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0c10; }
      #root { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .backdrop { width: 100%; height: 100%; object-fit: cover; }

      /* Teal shadows — blue-green cast in darks */
      #teal-shadow {
        position: absolute; inset: 0; z-index: 40; pointer-events: none;
        background: linear-gradient(135deg, rgba(0,80,120,0.22) 0%, transparent 50%);
        mix-blend-mode: multiply;
        opacity: 0;
      }

      /* Orange highlights — warm glow in brights */
      #orange-highlight {
        position: absolute; inset: 0; z-index: 41; pointer-events: none;
        background: linear-gradient(225deg, rgba(200,80,20,0.18) 0%, transparent 55%);
        mix-blend-mode: screen;
        opacity: 0;
      }

      /* Subtle overall warm midtone */
      #warm-mid {
        position: absolute; inset: 0; z-index: 42; pointer-events: none;
        background: rgba(200,120,60,0.06);
        mix-blend-mode: overlay;
        opacity: 0;
      }

      .seg-bar {
        position: absolute; bottom: 0; left: 0; right: 0; height: 64px;
        background: rgba(10,12,16,0.85); backdrop-filter: blur(16px);
        border-top: 1px solid rgba(255,255,255,0.07);
        display: flex; align-items: center; padding: 0 40px; gap: 24px;
        z-index: 50; opacity: 0;
      }
      .seg-num { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.20em; color: rgba(255,255,255,0.22); text-transform: uppercase; }
      .seg-name { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.30em; color: rgba(255,255,255,0.80); text-transform: uppercase; }
      .seg-line { flex: 1; height: 1px; background: rgba(255,255,255,0.07); }
      .seg-desc { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 300; color: rgba(255,255,255,0.25); letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <img id="backdrop" class="clip" data-start="0" data-duration="8"
           src="/inventory/images/hudson-glass-backdrop.png" style="opacity:0" />
      <div id="teal-shadow" class="clip" data-start="0" data-duration="8"></div>
      <div id="orange-highlight" class="clip" data-start="0" data-duration="8"></div>
      <div id="warm-mid" class="clip" data-start="0" data-duration="8"></div>

      <div class="seg-bar clip" data-start="0" data-duration="8">
        <div class="seg-num">04</div>
        <div class="seg-name">TEAL / ORANGE</div>
        <div class="seg-line"></div>
        <div class="seg-desc">Shadows: cyan-teal · Highlights: warm amber</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.to("#backdrop", { opacity: 0.95, duration: 1.0, ease: "power2.out" }, 0);
      tl.to("#teal-shadow", { opacity: 1, duration: 1.5, ease: "power2.out" }, 0.2);
      tl.to("#orange-highlight", { opacity: 1, duration: 1.5, ease: "power2.out" }, 0.4);
      tl.to("#warm-mid", { opacity: 1, duration: 1.2, ease: "power2.out" }, 0.6);
      tl.fromTo(".seg-bar", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.8);

      // Fade out
      tl.to(".seg-bar", { opacity: 0, duration: 0.6 }, 7.0);
      tl.to("#warm-mid, #orange-highlight, #teal-shadow", { opacity: 0, duration: 0.5 }, 7.1);
      tl.to("#backdrop", { opacity: 0, duration: 0.8 }, 7.3);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
