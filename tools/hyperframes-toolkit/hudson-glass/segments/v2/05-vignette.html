<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0c10; }
      #root { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .backdrop { width: 100%; height: 100%; object-fit: cover; }

      /* Heavy vignette — radial darkening */
      #vignette {
        position: absolute; inset: 0; z-index: 40; pointer-events: none;
        background: radial-gradient(ellipse 90% 85% at 50% 50%, transparent 15%, rgba(0,0,0,0.92) 100%);
        opacity: 0;
      }

      /* Corner frame brackets */
      .bracket {
        position: absolute; z-index: 41; width: 48px; height: 48px;
        border: 1.5px solid rgba(255,255,255,0.30);
        opacity: 0;
      }
      .bracket.tl { top: 24px; left: 24px; border-right: none; border-bottom: none; }
      .bracket.tr { top: 24px; right: 24px; border-left: none; border-bottom: none; }
      .bracket.bl { bottom: 80px; left: 24px; border-right: none; border-top: none; }
      .bracket.br { bottom: 80px; right: 24px; border-left: none; border-top: none; }

      /* HUD tag top-right */
      #hud-tag {
        position: absolute; top: 32px; right: 40px; z-index: 42;
        font-family: 'JetBrains Mono', monospace; font-size: 9px;
        letter-spacing: 0.18em; color: rgba(255,255,255,0.30); text-transform: uppercase;
        padding: 5px 12px;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 20px;
        opacity: 0;
      }

      .seg-bar {
        position: absolute; bottom: 0; left: 0; right: 0; height: 64px;
        background: rgba(10,12,16,0.85); backdrop-filter: blur(16px);
        border-top: 1px solid rgba(255,255,255,0.07);
        display: flex; align-items: center; padding: 0 40px; gap: 24px;
        z-index: 50; opacity: 0;
      }
      .seg-num { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.20em; color: rgba(255,255,255,0.22); text-transform: uppercase; }
      .seg-name { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.30em; color: rgba(255,255,255,0.80); text-transform: uppercase; }
      .seg-line { flex: 1; height: 1px; background: rgba(255,255,255,0.07); }
      .seg-desc { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 300; color: rgba(255,255,255,0.25); letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <img id="backdrop" class="clip" data-start="0" data-duration="8"
           src="/inventory/images/hudson-glass-backdrop.png" style="opacity:0" />
      <div id="vignette" class="clip" data-start="0" data-duration="8"></div>
      <div class="bracket tl clip" data-start="0" data-duration="8"></div>
      <div class="bracket tr clip" data-start="0" data-duration="8"></div>
      <div class="bracket bl clip" data-start="0" data-duration="8"></div>
      <div class="bracket br clip" data-start="0" data-duration="8"></div>
      <div id="hud-tag" class="clip" data-start="0" data-duration="8">vignette on</div>

      <div class="seg-bar clip" data-start="0" data-duration="8">
        <div class="seg-num">05</div>
        <div class="seg-name">VIGNETTE</div>
        <div class="seg-line"></div>
        <div class="seg-desc">Radial edge darkening · Optical falloff · Frame brackets</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.to("#backdrop", { opacity: 0.95, duration: 1.0, ease: "power2.out" }, 0);
      tl.to("#vignette", { opacity: 1, duration: 1.2, ease: "power2.out" }, 0.3);
      tl.from(".bracket", { opacity: 0, scale: 0.85, duration: 0.5, stagger: 0.08 }, 0.8);
      tl.fromTo("#hud-tag", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.9);
      tl.fromTo(".seg-bar", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.0);

      tl.to(".seg-bar", { opacity: 0, duration: 0.6 }, 7.0);
      tl.to(".bracket, #hud-tag", { opacity: 0, duration: 0.4 }, 7.1);
      tl.to("#vignette", { opacity: 0, duration: 0.5 }, 7.2);
      tl.to("#backdrop", { opacity: 0, duration: 0.8 }, 7.3);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
