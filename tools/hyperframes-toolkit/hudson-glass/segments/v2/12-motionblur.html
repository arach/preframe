<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0c10; }
      #root { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .backdrop { width: 100%; height: 100%; object-fit: cover; }

      /* Motion blur ghost trail layers */
      .ghost { position: absolute; inset: 0; pointer-events: none; }
      #ghost-1 { background-image: url('/inventory/images/hudson-glass-backdrop.png'); background-size: cover; opacity: 0.05; }
      #ghost-2 { background-image: url('/inventory/images/hudson-glass-backdrop.png'); background-size: cover; opacity: 0.04; transform: translateX(0); }
      #ghost-3 { background-image: url('/inventory/images/hudson-glass-backdrop.png'); background-size: cover; opacity: 0.03; transform: translateX(0); }

      /* Direction indicator — moving bright streak */
      #streak {
        position: absolute; left: 0; top: 0; width: 0; height: 100%;
        background: linear-gradient(to right,
          transparent 0%,
          rgba(255,255,255,0.06) 40%,
          rgba(255,255,255,0.12) 50%,
          rgba(255,255,255,0.06) 60%,
          transparent 100%
        );
        opacity: 0;
      }

      /* Sharpen ring — slight edge glow from unsharp mask */
      #unsharp-glow {
        position: absolute; inset: 0; z-index: 40; pointer-events: none;
        background: radial-gradient(ellipse 50% 50% at 50% 50%,
          rgba(255,255,255,0.06) 0%,
          transparent 70%
        );
        opacity: 0;
      }

      .seg-bar {
        position: absolute; bottom: 0; left: 0; right: 0; height: 64px;
        background: rgba(10,12,16,0.88); backdrop-filter: blur(16px);
        border-top: 1px solid rgba(255,255,255,0.07);
        display: flex; align-items: center; padding: 0 40px; gap: 24px;
        z-index: 50; opacity: 0;
      }
      .seg-num { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.20em; color: rgba(255,255,255,0.22); text-transform: uppercase; }
      .seg-name { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.30em; color: rgba(255,255,255,0.80); text-transform: uppercase; }
      .seg-line { flex: 1; height: 1px; background: rgba(255,255,255,0.07); }
      .seg-desc { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 300; color: rgba(255,255,255,0.25); letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <img id="backdrop" class="clip" data-start="0" data-duration="8"
           src="/inventory/images/hudson-glass-backdrop.png" style="opacity:0" />
      <div id="ghost-1" class="ghost"></div>
      <div id="ghost-2" class="ghost"></div>
      <div id="ghost-3" class="ghost"></div>
      <div id="streak" class="clip" data-start="0" data-duration="8"></div>
      <div id="unsharp-glow" class="clip" data-start="0" data-duration="8"></div>

      <div class="seg-bar clip" data-start="0" data-duration="8">
        <div class="seg-num">12</div>
        <div class="seg-name">MOTION BLUR</div>
        <div class="seg-line"></div>
        <div class="seg-desc">Temporal ghost trail · Speed streak · Unsharp glow</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.to("#backdrop", { opacity: 0.88, duration: 1.0, ease: "power2.out" }, 0);
      tl.to("#ghost-1", { opacity: 0.05, duration: 0.8 }, 0.2);
      tl.to("#ghost-2", { opacity: 0.04, duration: 0.8 }, 0.3);
      tl.to("#ghost-3", { opacity: 0.03, duration: 0.8 }, 0.4);
      tl.to("#unsharp-glow", { opacity: 1, duration: 1.2, ease: "power2.out" }, 0.5);
      tl.fromTo(".seg-bar", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.8);

      // Horizontal motion blur — translate ghost layers
      tl.to("#ghost-2", { x: 80, duration: 0.4, ease: "power2.in" }, 1.0);
      tl.to("#ghost-2", { x: -60, duration: 0.3, ease: "power2.out" }, 1.4);
      tl.to("#ghost-3", { x: 140, duration: 0.5, ease: "power2.in" }, 1.2);
      tl.to("#ghost-3", { x: -90, duration: 0.35, ease: "power2.out" }, 1.7);

      // Streak sweeps across frame
      tl.to("#streak", { opacity: 1, duration: 0.2 }, 2.5);
      tl.to("#streak", { width: '120%', left: '-10%', duration: 0.6, ease: "power3.inOut" }, 2.5);
      tl.to("#streak", { opacity: 0, duration: 0.3 }, 3.1);
      tl.to("#streak", { width: '0%', left: '0%', duration: 0.01 }, 3.4);
      tl.to("#streak", { opacity: 1, duration: 0.2 }, 4.2);
      tl.to("#streak", { width: '120%', left: '-10%', duration: 0.8, ease: "power3.inOut" }, 4.2);
      tl.to("#streak", { opacity: 0, duration: 0.3 }, 5.0);
      tl.to("#streak", { width: '0%', left: '0%', duration: 0.01 }, 5.3);

      // Ghosts drift again at end
      tl.to("#ghost-2", { x: 60, duration: 1.5, ease: "sine.inOut" }, 5.5);
      tl.to("#ghost-3", { x: 100, duration: 1.5, ease: "sine.inOut" }, 5.5);

      tl.to(".seg-bar", { opacity: 0, duration: 0.6 }, 7.0);
      tl.to("#streak", { opacity: 0, duration: 0.4 }, 7.1);
      tl.to("#ghost-3, #ghost-2, #ghost-1", { opacity: 0, duration: 0.4 }, 7.2);
      tl.to("#unsharp-glow", { opacity: 0, duration: 0.4 }, 7.3);
      tl.to("#backdrop", { opacity: 0, duration: 0.8 }, 7.4);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
