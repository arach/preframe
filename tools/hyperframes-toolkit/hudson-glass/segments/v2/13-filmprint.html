<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0c10; }
      #root { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .backdrop { width: 100%; height: 100%; object-fit: cover; }

      /* Warm amber — highlights pushed toward orange/amber */
      #warm-hi {
        position: absolute; inset: 0; z-index: 40; pointer-events: none;
        background: radial-gradient(ellipse 70% 60% at 50% 35%,
          rgba(255,160,60,0.18) 0%,
          transparent 55%
        );
        mix-blend-mode: screen;
        opacity: 0;
      }
      /* Compressed blacks — lifted slightly (film print toe) */
      #lift-black {
        position: absolute; inset: 0; z-index: 41; pointer-events: none;
        background: rgba(15,10,8,0.22);
        mix-blend-mode: multiply;
        opacity: 0;
      }
      /* Warm separation in midtones */
      #warm-mid {
        position: absolute; inset: 0; z-index: 42; pointer-events: none;
        background: rgba(200,110,50,0.08);
        mix-blend-mode: overlay;
        opacity: 0;
      }
      /* Soft vignette — mild, cinematic */
      #vignette {
        position: absolute; inset: 0; z-index: 43; pointer-events: none;
        background: radial-gradient(ellipse 85% 80% at 50% 50%, transparent 30%, rgba(0,0,0,0.80) 100%);
        opacity: 0;
      }
      /* Grain overlay */
      #grain {
        position: absolute; inset: 0; z-index: 44; pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.80' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
        background-size: 180px 180px;
        mix-blend-mode: overlay;
        opacity: 0;
      }

      .seg-bar {
        position: absolute; bottom: 0; left: 0; right: 0; height: 64px;
        background: rgba(10,12,16,0.88); backdrop-filter: blur(16px);
        border-top: 1px solid rgba(255,255,255,0.07);
        display: flex; align-items: center; padding: 0 40px; gap: 24px;
        z-index: 50; opacity: 0;
      }
      .seg-num { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.20em; color: rgba(255,255,255,0.22); text-transform: uppercase; }
      .seg-name { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.30em; color: rgba(255,255,255,0.80); text-transform: uppercase; }
      .seg-line { flex: 1; height: 1px; background: rgba(255,255,255,0.07); }
      .seg-desc { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 300; color: rgba(255,255,255,0.25); letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <img id="backdrop" class="clip" data-start="0" data-duration="8"
           src="/inventory/images/hudson-glass-backdrop.png" style="opacity:0" />
      <div id="warm-hi" class="clip" data-start="0" data-duration="8"></div>
      <div id="lift-black" class="clip" data-start="0" data-duration="8"></div>
      <div id="warm-mid" class="clip" data-start="0" data-duration="8"></div>
      <div id="vignette" class="clip" data-start="0" data-duration="8"></div>
      <div id="grain" class="clip" data-start="0" data-duration="8"></div>

      <div class="seg-bar clip" data-start="0" data-duration="8">
        <div class="seg-num">13</div>
        <div class="seg-name">FILM PRINT</div>
        <div class="seg-line"></div>
        <div class="seg-desc">Warm print · Lifted blacks · Compressed highlights</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.to("#backdrop", { opacity: 0.90, duration: 1.0, ease: "power2.out" }, 0);
      tl.to("#warm-hi", { opacity: 1, duration: 2.0, ease: "power2.out" }, 0.3);
      tl.to("#lift-black", { opacity: 1, duration: 1.8, ease: "power2.out" }, 0.5);
      tl.to("#warm-mid", { opacity: 1, duration: 1.5, ease: "power2.out" }, 0.7);
      tl.to("#vignette", { opacity: 1, duration: 1.5, ease: "power2.out" }, 0.9);
      tl.to("#grain", { opacity: 1, duration: 1.0 }, 1.1);
      tl.fromTo(".seg-bar", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.2);

      // Slow breathe — film is organic
      tl.to("#warm-hi", { opacity: 0.65, duration: 3.0, ease: "sine.inOut" }, 3.0);
      tl.to("#warm-hi", { opacity: 1.0, duration: 3.0, ease: "sine.inOut" }, 6.0);
      tl.to("#vignette", { opacity: 0.7, duration: 2.5, ease: "sine.inOut" }, 3.5);
      tl.to("#vignette", { opacity: 1.0, duration: 2.5, ease: "sine.inOut" }, 6.0);

      // Animate grain position
      const grainEl = document.getElementById('grain');
      const grainPos = ['0px 0px', '3px 2px', '-2px 1px', '1px -3px', '-1px 2px', '2px -1px'];
      let gi = 0;
      const grainInt = setInterval(function() {
        gi++;
        grainEl.style.backgroundPosition = grainPos[gi % grainPos.length];
      }, 90);
      tl.to({}, { duration: 6.8, onComplete: function() { clearInterval(grainInt); } }, 0);

      tl.to(".seg-bar", { opacity: 0, duration: 0.6 }, 7.0);
      tl.to("#grain", { opacity: 0, duration: 0.5 }, 7.1);
      tl.to("#vignette", { opacity: 0, duration: 0.5 }, 7.2);
      tl.to("#warm-mid, #lift-black, #warm-hi", { opacity: 0, duration: 0.5 }, 7.3);
      tl.to("#backdrop", { opacity: 0, duration: 0.8 }, 7.5);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
