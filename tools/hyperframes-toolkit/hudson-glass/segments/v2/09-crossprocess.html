<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0c10; }
      #root { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .backdrop { width: 100%; height: 100%; object-fit: cover; }

      /* Cross-processing: push shadows toward cyan/teal, highlights toward magenta/pink */
      #teal-shadow {
        position: absolute; inset: 0; z-index: 40; pointer-events: none;
        background: linear-gradient(160deg, rgba(0,90,130,0.28) 0%, transparent 45%);
        mix-blend-mode: multiply;
        opacity: 0;
      }
      #magenta-highlight {
        position: absolute; inset: 0; z-index: 41; pointer-events: none;
        background: linear-gradient(340deg, rgba(200,40,120,0.18) 0%, transparent 45%);
        mix-blend-mode: screen;
        opacity: 0;
      }
      #lift-shadows {
        position: absolute; inset: 0; z-index: 42; pointer-events: none;
        background: rgba(60,100,120,0.08);
        mix-blend-mode: overlay;
        opacity: 0;
      }
      #vignette {
        position: absolute; inset: 0; z-index: 43; pointer-events: none;
        background: radial-gradient(ellipse 85% 80% at 50% 50%, transparent 20%, rgba(0,0,0,0.85) 100%);
        opacity: 0;
      }

      .seg-bar {
        position: absolute; bottom: 0; left: 0; right: 0; height: 64px;
        background: rgba(10,12,16,0.88); backdrop-filter: blur(16px);
        border-top: 1px solid rgba(255,255,255,0.07);
        display: flex; align-items: center; padding: 0 40px; gap: 24px;
        z-index: 50; opacity: 0;
      }
      .seg-num { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.20em; color: rgba(255,255,255,0.22); text-transform: uppercase; }
      .seg-name { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.30em; color: rgba(255,255,255,0.80); text-transform: uppercase; }
      .seg-line { flex: 1; height: 1px; background: rgba(255,255,255,0.07); }
      .seg-desc { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 300; color: rgba(255,255,255,0.25); letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <img id="backdrop" class="clip" data-start="0" data-duration="8"
           src="/inventory/images/hudson-glass-backdrop.png" style="opacity:0" />
      <div id="teal-shadow" class="clip" data-start="0" data-duration="8"></div>
      <div id="magenta-highlight" class="clip" data-start="0" data-duration="8"></div>
      <div id="lift-shadows" class="clip" data-start="0" data-duration="8"></div>
      <div id="vignette" class="clip" data-start="0" data-duration="8"></div>

      <div class="seg-bar clip" data-start="0" data-duration="8">
        <div class="seg-num">09</div>
        <div class="seg-name">CROSS PROCESS</div>
        <div class="seg-line"></div>
        <div class="seg-desc">Cyan shadows · Magenta highlights · E-6 slide film</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.to("#backdrop", { opacity: 0.95, duration: 1.0, ease: "power2.out" }, 0);
      tl.to("#teal-shadow", { opacity: 1, duration: 1.8, ease: "power2.out" }, 0.2);
      tl.to("#magenta-highlight", { opacity: 1, duration: 1.8, ease: "power2.out" }, 0.4);
      tl.to("#lift-shadows", { opacity: 1, duration: 1.5, ease: "power2.out" }, 0.6);
      tl.to("#vignette", { opacity: 1, duration: 1.2, ease: "power2.out" }, 0.8);
      tl.fromTo(".seg-bar", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.0);

      // Breathe — cross process is lush
      tl.to("#teal-shadow", { opacity: 0.7, duration: 2.0, ease: "sine.inOut" }, 2.5);
      tl.to("#teal-shadow", { opacity: 1.0, duration: 2.0, ease: "sine.inOut" }, 4.5);
      tl.to("#magenta-highlight", { opacity: 0.6, duration: 2.5, ease: "sine.inOut" }, 3.0);
      tl.to("#magenta-highlight", { opacity: 1.0, duration: 2.0, ease: "sine.inOut" }, 5.5);

      tl.to(".seg-bar", { opacity: 0, duration: 0.6 }, 7.0);
      tl.to("#vignette", { opacity: 0, duration: 0.5 }, 7.1);
      tl.to("#teal-shadow, #magenta-highlight, #lift-shadows", { opacity: 0, duration: 0.5 }, 7.2);
      tl.to("#backdrop", { opacity: 0, duration: 0.8 }, 7.4);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
