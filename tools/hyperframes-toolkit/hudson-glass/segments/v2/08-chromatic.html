<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0c10; }
      #root { position: absolute; inset: 0; width: 192px; height: 1080px; }
      .backdrop { width: 100%; height: 100%; object-fit: cover; }

      /* Radial CA — R/B channels offset from center */
      .ca-layer { position: absolute; inset: 0; pointer-events: none; }
      #ca-r { background-color: rgba(255, 20, 60, 0.07); opacity: 0; }
      #ca-b { background-color: rgba(0, 80, 255, 0.07); opacity: 0; }

      /* Radial vignette emphasizing the effect at edges */
      #ca-vignette {
        position: absolute; inset: 0; z-index: 32; pointer-events: none;
        background: radial-gradient(ellipse 120% 120% at 50% 50%,
          transparent 35%,
          rgba(0,50,120,0.04) 60%,
          rgba(0,0,0,0.25) 100%
        );
        opacity: 0;
      }

      #ca-wrap {
        position: absolute; right: 80px; top: 44%;
        transform: translateY(-50%);
        z-index: 40; opacity: 0; text-align: right;
      }
      .ca-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.30em; color: rgba(100,180,255,0.50); text-transform: uppercase; margin-bottom: 8px; }
      .ca-word { font-family: 'JetBrains Mono', monospace; font-size: 72px; font-weight: 600; letter-spacing: -0.02em; color: #fff; line-height: 1; }
      .ca-bar { width: 40px; height: 2px; background: rgba(100,180,255,0.30); margin-top: 14px; margin-left: auto; }

      .seg-bar {
        position: absolute; bottom: 0; left: 0; right: 0; height: 64px;
        background: rgba(10,12,16,0.88); backdrop-filter: blur(16px);
        border-top: 1px solid rgba(255,255,255,0.07);
        display: flex; align-items: center; padding: 0 40px; gap: 24px;
        z-index: 50; opacity: 0;
      }
      .seg-num { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.20em; color: rgba(255,255,255,0.22); text-transform: uppercase; }
      .seg-name { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.30em; color: rgba(255,255,255,0.80); text-transform: uppercase; }
      .seg-line { flex: 1; height: 1px; background: rgba(255,255,255,0.07); }
      .seg-desc { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 300; color: rgba(255,255,255,0.25); letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <img id="backdrop" class="clip" data-start="0" data-duration="8"
           src="/inventory/images/hudson-glass-backdrop.png" style="opacity:0.85" />
      <div id="ca-r" class="ca-layer"></div>
      <div id="ca-b" class="ca-layer"></div>
      <div id="ca-vignette" class="clip" data-start="0" data-duration="8"></div>
      <div id="ca-wrap">
        <div class="ca-label">Segment 08</div>
        <div class="ca-word">CHROMATIC</div>
        <div class="ca-bar"></div>
      </div>
      <div class="seg-bar clip" data-start="0" data-duration="8">
        <div class="seg-num">08</div>
        <div class="seg-name">CHROMATIC</div>
        <div class="seg-line"></div>
        <div class="seg-desc">Radial aberration · RGB channel split · Spectral fringing</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#ca-r", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.8, ease: "power2.out" }, 0.1);
      tl.fromTo("#ca-b", { opacity: 0, x: 12 }, { opacity: 1, x: 0, duration: 0.8, ease: "power2.out" }, 0.2);
      tl.fromTo("#ca-vignette", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power2.out" }, 0.4);
      tl.fromTo("#ca-wrap", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.4);
      tl.fromTo(".seg-bar", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.8);

      // CA breathes — channels drift slightly
      tl.to("#ca-r", { x: 5, scale: 1.005, duration: 1.5, ease: "sine.inOut" }, 2.0);
      tl.to("#ca-r", { x: -7, scale: 1.008, duration: 1.5, ease: "sine.inOut" }, 3.5);
      tl.to("#ca-b", { x: -5, scale: 1.005, duration: 1.5, ease: "sine.inOut" }, 2.0);
      tl.to("#ca-b", { x: 7, scale: 1.008, duration: 1.5, ease: "sine.inOut" }, 3.5);

      tl.to(".seg-bar", { opacity: 0, duration: 0.6 }, 7.0);
      tl.to("#ca-wrap", { opacity: 0, duration: 0.4 }, 7.1);
      tl.to("#ca-r, #ca-b, #ca-vignette", { opacity: 0, duration: 0.5 }, 7.2);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
