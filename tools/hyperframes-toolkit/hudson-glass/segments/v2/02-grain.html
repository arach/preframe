<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0c10; }
      #root { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .backdrop { width: 100%; height: 100%; object-fit: cover; }

      /* Film grain via SVG feTurbulence */
      #grain-layer {
        position: absolute; inset: 0; z-index: 40; pointer-events: none;
        opacity: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
        background-size: 160px 160px;
        mix-blend-mode: overlay;
      }

      /* Subtle vignette */
      #vignette {
        position: absolute; inset: 0; z-index: 41; pointer-events: none;
        background: radial-gradient(ellipse 80% 75% at 50% 50%, transparent 25%, rgba(0,0,0,0.75) 100%);
        opacity: 0;
      }

      .seg-bar {
        position: absolute; bottom: 0; left: 0; right: 0; height: 64px;
        background: rgba(10,12,16,0.85); backdrop-filter: blur(16px);
        border-top: 1px solid rgba(255,255,255,0.07);
        display: flex; align-items: center; padding: 0 40px; gap: 24px;
        z-index: 50; opacity: 0;
      }
      .seg-num { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.20em; color: rgba(255,255,255,0.22); text-transform: uppercase; }
      .seg-name { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.30em; color: rgba(255,255,255,0.80); text-transform: uppercase; }
      .seg-line { flex: 1; height: 1px; background: rgba(255,255,255,0.07); }
      .seg-desc { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 300; color: rgba(255,255,255,0.25); letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <img id="backdrop" class="clip" data-start="0" data-duration="8"
           src="/inventory/images/hudson-glass-backdrop.png" style="opacity:0" />
      <div id="grain-layer" class="clip" data-start="0" data-duration="8"></div>
      <div id="vignette" class="clip" data-start="0" data-duration="8"></div>

      <div class="seg-bar clip" data-start="0" data-duration="8">
        <div class="seg-num">02</div>
        <div class="seg-name">FILM GRAIN</div>
        <div class="seg-line"></div>
        <div class="seg-desc">fractalNoise texture · Overlay blend · Analog character</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const proxy = { t: 0, grain: 0 };
      const tl = gsap.timeline({ paused: true });

      // Flicker grain via GSAP
      tl.to("#backdrop", { opacity: 0.92, duration: 1.0, ease: "power2.out" }, 0);
      tl.to("#grain-layer", { opacity: 1, duration: 0.4 }, 0.3);
      tl.to("#vignette", { opacity: 1, duration: 0.8 }, 0.4);
      tl.fromTo(".seg-bar", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.8);

      // Grain flicker via JS-driven background-position jitter
      const grainEl = document.getElementById('grain-layer');
      const positions = [
        '0px 0px', '2px 1px', '-1px 3px', '3px -2px', '-2px 1px',
        '1px 4px', '-3px 2px', '0px -1px', '2px 2px', '-1px -3px'
      ];
      let pIdx = 0;
      function flickerGrain() {
        grainEl.style.backgroundPosition = positions[pIdx % positions.length];
        pIdx++;
      }
      // Change grain position every 80ms for animated feel
      const flickerInterval = setInterval(flickerGrain, 80);

      // Expire grain animation before fade
      tl.to({}, {
        duration: 6.5,
        onComplete: function() { clearInterval(flickerInterval); }
      }, 0);

      tl.to(".seg-bar", { opacity: 0, duration: 0.6 }, 7.0);
      tl.to("#grain-layer", { opacity: 0, duration: 0.4 }, 7.1);
      tl.to("#vignette", { opacity: 0, duration: 0.5 }, 7.2);
      tl.to("#backdrop", { opacity: 0, duration: 0.8 }, 7.3);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
