<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0c10; }
      #root { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .backdrop { width: 100%; height: 100%; object-fit: cover; }

      /* Heat shimmer — warm gradient rising from bottom */
      #shimmer-a {
        position: absolute; bottom: 0; left: 0; right: 0; height: 65%;
        background: linear-gradient(to top,
          rgba(255, 160, 60, 0.10) 0%,
          rgba(255, 100, 30, 0.05) 40%,
          transparent 100%
        );
        mix-blend-mode: screen;
        opacity: 0;
      }
      #shimmer-b {
        position: absolute; bottom: 0; left: 0; right: 0; height: 50%;
        background: linear-gradient(to top,
          rgba(255, 200, 100, 0.08) 0%,
          transparent 60%
        );
        mix-blend-mode: screen;
        opacity: 0;
      }

      /* Undulating heat layers — JS-animated */
      #heat-wave {
        position: absolute; bottom: 0; left: 0; right: 0; height: 40%;
        background: linear-gradient(to top,
          rgba(255, 140, 50, 0.14) 0%,
          rgba(255, 100, 20, 0.06) 50%,
          transparent 100%
        );
        mix-blend-mode: overlay;
        opacity: 0;
      }

      .seg-bar {
        position: absolute; bottom: 0; left: 0; right: 0; height: 64px;
        background: rgba(10,12,16,0.88); backdrop-filter: blur(16px);
        border-top: 1px solid rgba(255,255,255,0.07);
        display: flex; align-items: center; padding: 0 40px; gap: 24px;
        z-index: 50; opacity: 0;
      }
      .seg-num { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.20em; color: rgba(255,255,255,0.22); text-transform: uppercase; }
      .seg-name { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.30em; color: rgba(255,255,255,0.80); text-transform: uppercase; }
      .seg-line { flex: 1; height: 1px; background: rgba(255,255,255,0.07); }
      .seg-desc { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 300; color: rgba(255,255,255,0.25); letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <img id="backdrop" class="clip" data-start="0" data-duration="8"
           src="/inventory/images/hudson-glass-backdrop.png" style="opacity:0" />
      <div id="shimmer-a" class="clip" data-start="0" data-duration="8"></div>
      <div id="shimmer-b" class="clip" data-start="0" data-duration="8"></div>
      <div id="heat-wave" class="clip" data-start="0" data-duration="8"></div>

      <div class="seg-bar clip" data-start="0" data-duration="8">
        <div class="seg-num">11</div>
        <div class="seg-name">THERMAL SHIMMER</div>
        <div class="seg-line"></div>
        <div class="seg-desc">Heat haze · Rising turbulence · Thermal distortion</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.to("#backdrop", { opacity: 0.90, duration: 1.0, ease: "power2.out" }, 0);
      tl.to("#shimmer-a", { opacity: 1, duration: 2.0, ease: "power2.out" }, 0.4);
      tl.to("#shimmer-b", { opacity: 1, duration: 2.0, ease: "power2.out" }, 0.7);
      tl.to("#heat-wave", { opacity: 1, duration: 1.5, ease: "power2.out" }, 1.0);
      tl.fromTo(".seg-bar", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.2);

      // Heat shimmer undulates — animate the gradient position
      const heatEl = document.getElementById('heat-wave');
      let phase = 0;
      const heatInterval = setInterval(function() {
        phase += 0.06;
        const y = Math.sin(phase) * 8;
        const opacity = 0.5 + Math.sin(phase * 1.3) * 0.3;
        gsap.set(heatEl, { y: y, opacity: opacity });
      }, 50);
      tl.to({}, { duration: 6.5, onComplete: function() { clearInterval(heatInterval); } }, 0);

      // shimmer layers fade in/out slightly offset
      tl.to("#shimmer-a", { opacity: 0.5, duration: 2.5, ease: "sine.inOut" }, 2.0);
      tl.to("#shimmer-a", { opacity: 1.0, duration: 2.0, ease: "sine.inOut" }, 4.5);
      tl.to("#shimmer-b", { opacity: 0.6, duration: 1.8, ease: "sine.inOut" }, 3.0);
      tl.to("#shimmer-b", { opacity: 1.0, duration: 2.5, ease: "sine.inOut" }, 4.8);

      tl.to(".seg-bar", { opacity: 0, duration: 0.6 }, 7.0);
      tl.to("#heat-wave", { opacity: 0, duration: 0.5 }, 7.1);
      tl.to("#shimmer-b", { opacity: 0, duration: 0.4 }, 7.2);
      tl.to("#shimmer-a", { opacity: 0, duration: 0.5 }, 7.3);
      tl.to("#backdrop", { opacity: 0, duration: 0.8 }, 7.4);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
