<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      @font-face {
        font-family: 'JetBrains Mono';
        src: local('JetBrainsMonoNerdFont-Regular'), local('JetBrains Mono Regular');
        font-weight: 400;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: local('JetBrainsMonoNerdFont-Bold'), local('JetBrains Mono Bold');
        font-weight: 600;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0c10; }
      #root { position: absolute; inset: 0; width: 1920px; height: 1080px; }

      .backdrop-wrap { position: absolute; inset: 0; overflow: hidden; }
      .backdrop { width: 100%; height: 100%; object-fit: cover; opacity: 0; }

      /* Radial vignette overlay */
      #vignette {
        position: absolute; inset: 0; z-index: 40; pointer-events: none;
        background: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 30%, rgba(0,0,0,0.85) 100%);
        opacity: 0;
      }

      /* Corner brackets */
      .bracket {
        position: absolute; z-index: 35; width: 40px; height: 40px; opacity: 0;
      }
      .bracket.tl { top: 20px; left: 20px; border-top: 1.5px solid rgba(255,255,255,0.35); border-left: 1.5px solid rgba(255,255,255,0.35); }
      .bracket.br { bottom: 80px; right: 20px; border-bottom: 1.5px solid rgba(255,255,255,0.35); border-right: 1.5px solid rgba(255,255,255,0.35); }

      /* HUD pill */
      .hud-tag {
        position: absolute; top: 32px; right: 36px; z-index: 40;
        font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 400;
        letter-spacing: 0.20em; color: rgba(255,255,255,0.35); text-transform: uppercase;
        padding: 5px 12px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.10);
        border-radius: 20px;
        opacity: 0;
      }

      /* Terminal window */
      .glass {
        background: rgba(14,18,28,0.72);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(255,255,255,0.10);
        border-radius: 8px;
      }
      .hudson-win { position: absolute; z-index: 20; opacity: 0; }
      .win-bar { height: 28px; display: flex; align-items: center; padding: 0 10px; gap: 5px; border-bottom: 1px solid rgba(255,255,255,0.06); }
      .dot { width: 8px; height: 8px; border-radius: 50%; }
      .dot.r { background: rgba(255,80,80,0.55); }
      .dot.y { background: rgba(255,195,60,0.55); }
      .dot.g { background: rgba(70,200,130,0.60); }
      .win-title { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: rgba(255,255,255,0.22); letter-spacing: 0.08em; margin-left: 4px; }
      .term-body { padding: 12px 14px; font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.8; color: rgba(255,255,255,0.68); }
      .t-prompt { color: rgba(255,255,255,0.18); }
      .t-cursor { display: inline-block; width: 6px; height: 12px; background: rgba(255,255,255,0.70); vertical-align: middle; animation: blink 1.1s step-end infinite; }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

      /* Segment caption */
      .seg-bar {
        position: absolute; bottom: 0; left: 0; right: 0; height: 64px;
        background: rgba(10,12,16,0.70); backdrop-filter: blur(12px);
        border-top: 1px solid rgba(255,255,255,0.07);
        display: flex; align-items: center; padding: 0 40px; gap: 24px;
        z-index: 40; opacity: 0;
      }
      .seg-num { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.20em; color: rgba(255,255,255,0.22); text-transform: uppercase; }
      .seg-name { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.30em; color: rgba(255,255,255,0.75); text-transform: uppercase; }
      .seg-line { flex: 1; height: 1px; background: rgba(255,255,255,0.07); }
      .seg-desc { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 300; color: rgba(255,255,255,0.25); letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8"
         data-width="1920" data-height="1080">

      <div class="backdrop-wrap">
        <img id="backdrop" class="backdrop" data-start="0" data-duration="8"
             src="../inventory/images/hudson-glass-backdrop.png" style="opacity:0" >
      </div>

      <div id="vignette" data-start="0" data-duration="8"></div>

      <div class="bracket tl" data-start="0" data-duration="8"></div>
      <div class="bracket br" data-start="0" data-duration="8"></div>
      <div class="hud-tag" data-start="0" data-duration="8">vignette on</div>

      <div id="win-term" class="hudson-win glass" data-start="0" data-duration="8"
           style="left:64px;bottom:80px;width:460px">
        <div class="win-bar">
          <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
          <span class="win-title">terminal</span>
        </div>
        <div class="term-body">
          <div><span class="t-prompt">→</span> hudson dev --port 3500</div>
          <div style="margin-top:4px"><span class="t-prompt">→</span> workspace ready<span class="t-cursor"></span></div>
        </div>
      </div>

      <div class="seg-bar" data-start="0" data-duration="8">
        <div class="seg-num">03</div>
        <div class="seg-name">VIGNETTE</div>
        <div class="seg-line"></div>
        <div class="seg-desc">Edge darkening · Unsharp mask · Warm grade</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.to("#backdrop", { opacity: 1, duration: 1.2, ease: "power2.out" }, 0);
      tl.to("#vignette", { opacity: 1, duration: 0.8, ease: "power2.out" }, 0.3);
      tl.from(".bracket", { opacity: 0, scale: 0.9, duration: 0.5, stagger: 0.1 }, 0.6);
      tl.from(".hud-tag", { opacity: 0, y: -12, duration: 0.5, ease: "power3.out" }, 0.8);
      tl.from("#win-term", { opacity: 0, x: -50, duration: 0.7, ease: "power3.out" }, 1.0);
      tl.from(".seg-bar", { opacity: 0, duration: 0.5 }, 1.2);

      tl.to(".seg-bar", { opacity: 0, duration: 0.5 }, 7.0);
      tl.to("#win-term", { opacity: 0, duration: 0.4 }, 7.0);
      tl.to(".bracket, .hud-tag", { opacity: 0, duration: 0.4 }, 7.2);
      tl.to("#vignette", { opacity: 0, duration: 0.4 }, 7.4);
      tl.to("#backdrop", { opacity: 0, duration: 0.8 }, 7.5);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
