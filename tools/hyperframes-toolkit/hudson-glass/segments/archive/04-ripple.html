<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      @font-face {
        font-family: 'JetBrains Mono';
        src: local('JetBrainsMonoNerdFont-Regular'), local('JetBrains Mono Regular');
        font-weight: 400;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: local('JetBrainsMonoNerdFont-Bold'), local('JetBrains Mono Bold');
        font-weight: 600;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0c10; }
      #root { position: absolute; inset: 0; width: 1920px; height: 1080px; }

      .backdrop-wrap { position: absolute; inset: 0; overflow: hidden; }
      .backdrop { width: 100%; height: 100%; object-fit: cover; opacity: 0; }

      /* Ripple rings (canvas-drawn, animated via GSAP) */
      #ripple-canvas {
        position: absolute; inset: 0; z-index: 30;
        pointer-events: none; opacity: 0;
      }

      /* Heat haze overlay */
      #haze {
        position: absolute; inset: 0; z-index: 31; pointer-events: none;
        background: linear-gradient(180deg, rgba(255,140,40,0.06) 0%, transparent 40%, transparent 60%, rgba(60,140,200,0.05) 100%);
        opacity: 0;
      }

      /* Wave distortion stripes */
      .wave-stripe {
        position: absolute; left: 0; right: 0; height: 3px;
        background: rgba(255,255,255,0.04);
        z-index: 25; pointer-events: none;
      }

      /* Caption */
      .seg-bar {
        position: absolute; bottom: 0; left: 0; right: 0; height: 64px;
        background: rgba(10,12,16,0.70); backdrop-filter: blur(12px);
        border-top: 1px solid rgba(255,255,255,0.07);
        display: flex; align-items: center; padding: 0 40px; gap: 24px;
        z-index: 40; opacity: 0;
      }
      .seg-num { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.20em; color: rgba(255,255,255,0.22); text-transform: uppercase; }
      .seg-name { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.30em; color: rgba(255,255,255,0.75); text-transform: uppercase; }
      .seg-line { flex: 1; height: 1px; background: rgba(255,255,255,0.07); }
      .seg-desc { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 300; color: rgba(255,255,255,0.25); letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8"
         data-width="1920" data-height="1080">

      <div class="backdrop-wrap" id="bw">
        <img id="backdrop" class="backdrop" data-start="0" data-duration="8"
             src="../inventory/images/hudson-glass-backdrop.png" style="opacity:0.75" >
      </div>

      <canvas id="ripple-canvas" width="1920" height="1080"></canvas>
      <div id="haze"></div>

      <div class="seg-bar" data-start="0" data-duration="8">
        <div class="seg-num">04</div>
        <div class="seg-name">DISRUPTION</div>
        <div class="seg-line"></div>
        <div class="seg-desc">Ripple waves · Heat haze · Thermal distortion</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Ripple canvas
      const canvas = document.getElementById('ripple-canvas');
      const ctx = canvas.getContext('2d');
      const cx = 960, cy = 540;

      // Build a proxy object to drive canvas
      const rp = { t: 0, phase: 0 };

      function drawRipple(progress, alpha) {
        ctx.clearRect(0, 0, 1920, 1080);
        if (alpha <= 0) return;

        // Concentric rings expanding outward
        const numRings = 6;
        for (let i = 0; i < numRings; i++) {
          const ringProgress = (progress + i / numRings) % 1.0;
          const radius = ringProgress * Math.max(1920, 1080);
          const a = alpha * (1 - ringProgress) * 0.25;
          if (a < 0.005) continue;
          ctx.beginPath();
          ctx.arc(cx, cy, radius, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(255,255,255,${a})`;
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
      }

      drawRipple(0, 0);

      // Timeline
      tl.to("#backdrop", { opacity: 0.80, duration: 0.8, ease: "power2.out" }, 0);
      tl.to("#ripple-canvas", { opacity: 1, duration: 0.5 }, 0.3);
      tl.to("#haze", { opacity: 1, duration: 1.0 }, 0.5);
      tl.from(".seg-bar", { opacity: 0, duration: 0.5 }, 0.8);

      // Drive ripple via proxy
      tl.to(rp, {
        t: 1, duration: 8, ease: "none",
        onUpdate: function() {
          const a = rp.t < 0.1 ? 0 : rp.t > 0.85 ? Math.max(0, (1 - rp.t) / 0.15) : 1;
          drawRipple(rp.t, a);
        }
      }, 0);

      // Wave distortion stripes — animate via GSAP
      const stripes = [];
      for (let y = 80; y < 1000; y += 60) {
        const el = document.createElement('div');
        el.className = 'wave-stripe';
        el.style.top = y + 'px';
        el.style.opacity = '0';
        document.getElementById('root').appendChild(el);
        stripes.push(el);
      }

      tl.to("#backdrop", { opacity: 0, duration: 0.8 }, 7.5);
      tl.to(".seg-bar", { opacity: 0, duration: 0.5 }, 7.0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
