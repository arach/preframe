<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      @font-face {
        font-family: 'JetBrains Mono';
        src: local('JetBrainsMonoNerdFont-Regular'), local('JetBrains Mono Regular');
        font-weight: 400;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: local('JetBrainsMonoNerdFont-Bold'), local('JetBrains Mono Bold');
        font-weight: 600;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0c10; }
      #root { position: absolute; inset: 0; width: 1920px; height: 1080px; }

      .backdrop-wrap { position: absolute; inset: 0; overflow: hidden; }
      .backdrop { width: 100%; height: 100%; object-fit: cover; }

      /* ── Warm light leak from top-left ── */
      #light-leak {
        position: absolute; inset: 0; z-index: 30; pointer-events: none;
        background:
          radial-gradient(ellipse 55% 45% at 18% 12%,
            rgba(255, 180, 80, 0.28) 0%,
            rgba(255, 140, 40, 0.12) 35%,
            transparent 65%
          ),
          radial-gradient(ellipse 35% 30% at 80% 85%,
            rgba(255, 100, 40, 0.10) 0%,
            transparent 60%
          );
        opacity: 0;
      }

      /* ── Shimmer sweep pass (horizontal band of light) ── */
      #shimmer {
        position: absolute; inset: 0; z-index: 31; pointer-events: none;
        background: linear-gradient(
          120deg,
          transparent 0%,
          transparent 38%,
          rgba(255, 200, 120, 0.10) 43%,
          rgba(255, 220, 140, 0.18) 46%,
          rgba(255, 200, 120, 0.10) 49%,
          transparent 52%,
          transparent 100%
        );
        opacity: 0;
        mix-blend-mode: screen;
      }

      /* ── Subtle grain ── */
      #grain {
        position: absolute; inset: 0; z-index: 32; pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.80' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
        background-size: 150px 150px;
        mix-blend-mode: overlay;
        opacity: 0;
      }

      /* ── Label ── */
      #lt-wrap {
        position: absolute; right: 80px; top: 50%;
        transform: translateY(-50%);
        z-index: 40; opacity: 0;
        text-align: right;
      }
      .lt-label {
        font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.30em;
        color: rgba(255,200,120,0.50); text-transform: uppercase; margin-bottom: 8px;
      }
      .lt-word {
        font-family: 'JetBrains Mono', monospace; font-size: 72px; font-weight: 600;
        letter-spacing: -0.02em; color: #fff; line-height: 1;
      }
      .lt-bar { width: 40px; height: 2px; background: rgba(255,200,120,0.30); margin-top: 14px; margin-left: auto; }

      /* ── Caption bar ── */
      .seg-bar {
        position: absolute; bottom: 0; left: 0; right: 0; height: 64px;
        background: rgba(10,12,16,0.82); backdrop-filter: blur(14px);
        border-top: 1px solid rgba(255,255,255,0.07);
        display: flex; align-items: center; padding: 0 40px; gap: 24px;
        z-index: 50; opacity: 0;
      }
      .seg-num { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.20em; color: rgba(255,255,255,0.22); text-transform: uppercase; }
      .seg-name { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.30em; color: rgba(255,255,255,0.80); text-transform: uppercase; }
      .seg-line { flex: 1; height: 1px; background: rgba(255,255,255,0.07); }
      .seg-desc { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 300; color: rgba(255,255,255,0.25); letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8"
         data-width="1920" data-height="1080">

      <div class="backdrop-wrap">
        <img id="backdrop" class="backdrop" data-start="0" data-duration="8"
             src="../inventory/images/hudson-glass-backdrop.png" style="opacity:0.80" >
      </div>

      <div id="light-leak" data-start="0" data-duration="8"></div>
      <div id="shimmer" data-start="0" data-duration="8"></div>
      <div id="grain" data-start="0" data-duration="8"></div>

      <div id="lt-wrap">
        <div class="lt-label">Segment 04</div>
        <div class="lt-word">DISRUPTION</div>
        <div class="lt-bar"></div>
      </div>

      <div class="seg-bar" data-start="0" data-duration="8">
        <div class="seg-num">04</div>
        <div class="seg-name">DISRUPTION</div>
        <div class="seg-line"></div>
        <div class="seg-desc">Light leak · Shimmer sweep · Warm haze</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Light leak fades in softly
      tl.to("#backdrop", { opacity: 0.85, duration: 1.0, ease: "power2.out" }, 0);
      tl.to("#light-leak", { opacity: 1, duration: 1.2, ease: "power2.out" }, 0.2);
      tl.fromTo("#lt-wrap", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.6);
      tl.fromTo(".seg-bar", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.8);

      // Shimmer sweep: a band of warm light moves diagonally across the screen
      tl.fromTo("#shimmer",
        { opacity: 0, "--shimmer-pos": "-20%" },
        { opacity: 1, duration: 0.4, ease: "power2.in" }, 1.0
      );
      // Manually animate shimmer via GSAP onUpdate proxy
      const shimmerProxy = { pos: -20 };
      tl.to(shimmerProxy, {
        pos: 130,
        duration: 3.5,
        ease: "power1.inOut",
        onUpdate: function() {
          const el = document.getElementById("shimmer");
          if (el) el.style.background = `linear-gradient(120deg,
            transparent 0%,
            transparent ${shimmerProxy.pos - 10}%,
            rgba(255,200,120,0.12) ${shimmerProxy.pos}%,
            rgba(255,220,140,0.22) ${shimmerProxy.pos + 3}%,
            rgba(255,200,120,0.12) ${shimmerProxy.pos + 6}%,
            transparent ${shimmerProxy.pos + 14}%,
            transparent 100%)`;
        }
      }, 1.0);

      // Grain: subtle, slow flicker
      tl.to("#grain", { opacity: 0.45, duration: 0.5 }, 0.4);
      // Flicker grain a couple times
      tl.to("#grain", { opacity: 0.2, duration: 0.3, ease: "power2.in" }, 2.5);
      tl.to("#grain", { opacity: 0.5, duration: 0.4, ease: "power2.out" }, 2.8);
      tl.to("#grain", { opacity: 0.25, duration: 0.3, ease: "power2.in" }, 4.5);
      tl.to("#grain", { opacity: 0.5, duration: 0.4, ease: "power2.out" }, 4.8);

      // Light leak pulses
      tl.to("#light-leak", { opacity: 0.5, duration: 1.5, ease: "sine.inOut" }, 2.0);
      tl.to("#light-leak", { opacity: 1.0, duration: 1.5, ease: "sine.inOut" }, 3.5);

      // Fade out
      tl.to(".seg-bar", { opacity: 0, duration: 0.6 }, 7.0);
      tl.to("#lt-wrap", { opacity: 0, duration: 0.5 }, 7.1);
      tl.to("#light-leak", { opacity: 0, duration: 0.6 }, 7.2);
      tl.to("#shimmer", { opacity: 0, duration: 0.4 }, 7.3);
      tl.to("#grain", { opacity: 0, duration: 0.4 }, 7.4);
      tl.to("#backdrop", { opacity: 0, duration: 0.8 }, 7.5);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
