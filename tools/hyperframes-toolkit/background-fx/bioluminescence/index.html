<!-- hyperframes-registry-item: bioluminescence -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      [data-composition-id] { width: 1920px; height: 1080px; overflow: hidden; position: relative; }
      #bg-video { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; z-index: 0; }
      #fx-canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; z-index: 1; }
      #ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="bioluminescence" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <video id="bg-video" muted playsinline></video>
      <canvas id="fx-canvas" width="1920" height="1080"></canvas>
      <div id="ui-layer"></div>
      <div id="driver" class="clip" data-start="0" data-duration="8" data-track-index="0"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;"></div>
    </div>
    <script>
      (function() {
        var root = document.getElementById('root');
        var video = document.getElementById('bg-video');
        video.src = root.dataset.videoSrc || '../../assets/sample.mp4';
        var canvas = document.getElementById('fx-canvas');
        var gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });
        window.__timelines = window.__timelines || {};
        if (!gl) {
          console.warn('bioluminescence: WebGL not available');
          window.__timelines['bioluminescence'] = gsap.timeline({ paused: true });
          return;
        }
        gl.viewport(0, 0, 1920, 1080);

        var vertSrc = 'attribute vec2 a_pos; varying vec2 v_uv; void main(){v_uv = a_pos * 0.5 + 0.5; v_uv.y = 1.0 - v_uv.y; gl_Position = vec4(a_pos, 0.0, 1.0);}';

        var fragSrc =
          'precision mediump float;' +
          'varying vec2 v_uv;' +
          'uniform sampler2D u_video;' +
          'uniform float u_time;' +
          'uniform vec2 u_resolution;' +
          'float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}' +
          'float vnoise(vec2 p){' +
          '  vec2 i=floor(p),f=fract(p);' +
          '  f=f*f*(3.0-2.0*f);' +
          '  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}' +
          'float particle(vec2 uv,float cellSize,float seed,float t){' +
          '  vec2 cell=floor(uv/cellSize);' +
          '  vec2 cellUV=fract(uv/cellSize);' +
          '  vec2 center=vec2(0.3+hash(cell+vec2(seed,0.0))*0.4,0.3+hash(cell+vec2(0.0,seed))*0.4);' +
          '  float dist=length(cellUV-center);' +
          '  float phase=hash(cell+vec2(seed+1.0));' +
          '  float pulse=sin(t*(2.0+phase*2.0)+phase*6.28)*0.5+0.5;' +
          '  pulse=pow(pulse,2.0);' +
          '  return exp(-dist*dist*80.0)*pulse;}' +
          'void main(){' +
          '  float waveX=sin(v_uv.y*8.0+u_time*0.5)*0.003;' +
          '  float waveY=cos(v_uv.x*6.0+u_time*0.4)*0.002;' +
          '  vec2 warpedUV=v_uv+vec2(waveX,waveY)*v_uv.y;' +
          '  vec3 warpedCol=texture2D(u_video,clamp(warpedUV,0.0,1.0)).rgb*0.4;' +
          '  warpedCol=mix(vec3(0.0,0.06,0.15),warpedCol,0.35);' +
          '  float p1=particle(v_uv*u_resolution/60.0,1.0,0.0,u_time);' +
          '  float p2=particle(v_uv*u_resolution/30.0,1.0,7.3,u_time*1.3);' +
          '  float p3=particle(v_uv*u_resolution/20.0,1.0,13.7,u_time*0.8);' +
          '  float glow=p1*1.0+p2*0.7+p3*0.4;' +
          '  vec3 bioColor=mix(vec3(0.0,0.8,1.0),vec3(0.2,1.0,0.8),v_uv.x)*glow;' +
          '  float shimmer=vnoise(vec2(v_uv.x*4.0+u_time*0.2,v_uv.y*3.0));' +
          '  vec3 shimmerColor=vec3(0.0,0.3,0.5)*shimmer*0.15*smoothstep(0.7,0.3,v_uv.y);' +
          '  vec3 result=warpedCol+bioColor*0.8+shimmerColor;' +
          '  result=mix(result,1.0-(1.0-warpedCol)*(1.0-bioColor*0.6),0.5);' +
          '  gl_FragColor=vec4(clamp(result,0.0,1.0),1.0);}';

        var quadBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

        function compileShader(src, type) {
          var s = gl.createShader(type);
          gl.shaderSource(s, src); gl.compileShader(s);
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error('bioluminescence shader:', gl.getShaderInfoLog(s));
          return s;
        }
        function mkProg(fSrc) {
          var p = gl.createProgram();
          gl.attachShader(p, compileShader(vertSrc, gl.VERTEX_SHADER));
          gl.attachShader(p, compileShader(fSrc, gl.FRAGMENT_SHADER));
          gl.linkProgram(p);
          if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error('bioluminescence link:', gl.getProgramInfoLog(p));
          return p;
        }

        var prog = mkProg(fragSrc);
        var videoTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, videoTex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));

        function draw(t) {
          if (video.readyState >= 2) {
            gl.bindTexture(gl.TEXTURE_2D, videoTex);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
          }
          gl.useProgram(prog);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, videoTex);
          gl.uniform1i(gl.getUniformLocation(prog, 'u_video'), 0);
          gl.uniform1f(gl.getUniformLocation(prog, 'u_time'), t);
          gl.uniform2f(gl.getUniformLocation(prog, 'u_resolution'), 1920.0, 1080.0);
          var pos = gl.getAttribLocation(prog, 'a_pos');
          gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
          gl.enableVertexAttribArray(pos);
          gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }

        draw(0);
        var tl = gsap.timeline({ paused: true, onUpdate: function(){ draw(tl.time() * (window.__params && window.__params.speed !== undefined ? window.__params.speed : 1.0)); } });
        tl.to({ t: 0 }, { t: 8, duration: 8, ease: 'none' }, 0);
        window.__timelines['bioluminescence'] = tl;
      })();
    </script>
  </body>
</html>
