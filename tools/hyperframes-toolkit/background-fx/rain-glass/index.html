<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
    [data-composition-id] { width: 1920px; height: 1080px; overflow: hidden; position: relative; }
    #bg-video { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; display: none; }
    #fx-canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; z-index: 1; }
    #ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="rain-glass" data-start="0" data-duration="8" data-width="1920" data-height="1080">
    <video id="bg-video" muted playsinline></video>
    <canvas id="fx-canvas" width="1920" height="1080"></canvas>
    <div id="ui-layer"></div>
    <div class="clip" data-start="0" data-duration="8" data-track-index="0"
         style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    var video = document.getElementById('bg-video');
    video.src = document.getElementById('root').dataset.videoSrc || '../../assets/sample.mp4';
    var canvas = document.getElementById('fx-canvas');
    var gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });
    gl.viewport(0, 0, 1920, 1080);

    var vertSrc = 'attribute vec2 a_pos;varying vec2 v_uv;void main(){v_uv=a_pos*.5+.5;v_uv.y=1.-v_uv.y;gl_Position=vec4(a_pos,0,1);}';
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

    function compile(src, type) {
      var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
      return s;
    }
    function mkProg(frag) {
      var p = gl.createProgram();
      gl.attachShader(p, compile(vertSrc, gl.VERTEX_SHADER));
      gl.attachShader(p, compile(frag, gl.FRAGMENT_SHADER));
      gl.linkProgram(p); return p;
    }
    function mkTex() {
      var t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));
      return t;
    }
    function upload(tex) {
      if (video.readyState >= 2) {
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
      }
    }
    function draw(prog) {
      var loc = gl.getAttribLocation(prog, 'a_pos');
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    var vTex = mkTex();

    var fragSrc = [
      'precision mediump float;',
      'varying vec2 v_uv;',
      'uniform sampler2D u_video;',
      'uniform float u_time;',
      'uniform vec2 u_resolution;',
      'uniform float u_drop_density;',
      'uniform float u_blur_radius;',
      'uniform float u_streak_length;',
      'float hash(float n){ return fract(sin(n)*43758.5453); }',
      'vec2 dropletDistort(vec2 uv, float t){',
      '  vec2 total = vec2(0.0);',
      '  for(int i=0;i<40;i++){',
      '    float fi=float(i);',
      '    float bx=hash(fi*1.1);',
      '    float by=hash(fi*2.3)*0.7;',
      '    float r=(hash(fi*3.7)*0.025+0.01)*u_drop_density;',
      '    float speed=(hash(fi*4.1)*0.08+0.03)*u_streak_length;',
      '    float startT=hash(fi*5.3)*6.0;',
      '    float elapsed=max(0.0,t-startT);',
      '    float cy=fract(by+elapsed*speed);',
      '    vec2 center=vec2(bx,cy);',
      '    vec2 delta=uv-center;',
      '    delta.x*=u_resolution.x/u_resolution.y;',
      '    float dist=length(delta);',
      '    if(dist<r){',
      '      float s=(1.0-dist/r);s=s*s;',
      '      vec2 ref=(uv-center)*(1.0-s*1.8);',
      '      ref.x/=(u_resolution.x/u_resolution.y);',
      '      total+=(ref+center)-uv;',
      '    }',
      '  }',
      '  return total;',
      '}',
      'vec4 softBlur(vec2 uv, float r){',
      '  vec2 t=vec2(r)/u_resolution;',
      '  return (texture2D(u_video,uv)',
      '         +texture2D(u_video,uv+vec2(t.x,0.))',
      '         +texture2D(u_video,uv-vec2(t.x,0.))',
      '         +texture2D(u_video,uv+vec2(0.,t.y))',
      '         +texture2D(u_video,uv-vec2(0.,t.y)))/5.0;',
      '}',
      'void main(){',
      '  vec4 base=softBlur(v_uv,2.5*u_blur_radius);',
      '  vec2 offset=dropletDistort(v_uv,u_time);',
      '  vec4 refracted=softBlur(clamp(v_uv+offset,0.,1.),u_blur_radius);',
      '  float dropStr=min(length(offset)*80.0,1.0);',
      '  vec4 col=mix(base,refracted,dropStr);',
      '  float luma=dot(col.rgb,vec3(0.299,0.587,0.114));',
      '  col.rgb=mix(col.rgb,vec3(luma*0.95+0.02),0.15);',
      '  float v=length((v_uv-0.5)*1.3);',
      '  col.rgb*=1.0-smoothstep(0.45,0.85,v)*0.4;',
      '  gl_FragColor=vec4(col.rgb,1.0);',
      '}'
    ].join('\n');

    var prog = mkProg(fragSrc);
    gl.useProgram(prog);
    gl.uniform2f(gl.getUniformLocation(prog, 'u_resolution'), 1920.0, 1080.0);
    var uVideo = gl.getUniformLocation(prog, 'u_video');
    var uTime = gl.getUniformLocation(prog, 'u_time');

    var proxy = { t: 0 };
    var tl = gsap.timeline({ paused: true,
      onUpdate: function() {
        upload(vTex);
        gl.useProgram(prog);
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, vTex);
        gl.uniform1i(uVideo, 0);
        gl.uniform1f(uTime, proxy.t * (window.__params && window.__params.speed !== undefined ? window.__params.speed : 1.0));
        gl.uniform1f(gl.getUniformLocation(prog, 'u_drop_density'), (window.__params && window.__params.drop_density !== undefined ? window.__params.drop_density : 1.0));
        gl.uniform1f(gl.getUniformLocation(prog, 'u_blur_radius'), (window.__params && window.__params.blur_radius !== undefined ? window.__params.blur_radius : 1.0));
        gl.uniform1f(gl.getUniformLocation(prog, 'u_streak_length'), (window.__params && window.__params.streak_length !== undefined ? window.__params.streak_length : 1.0));
        draw(prog);
      }
    });
    tl.to(proxy, { t: 8, duration: 8, ease: 'none' }, 0);
    window.__timelines['rain-glass'] = tl;

        // Parameter control bridge
        window.__params = window.__params || {};
        window.__setParam = function(name, value) { window.__params[name] = value; };
        window.addEventListener('message', function(e) {
          if (e.data && e.data.type === 'fx-param') window.__params[e.data.name] = e.data.value;
        });
  </script>
</body>
</html>
