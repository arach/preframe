<!-- hyperframes-registry-item: lenticular -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      [data-composition-id] { width: 1920px; height: 1080px; overflow: hidden; position: relative; }
      #bg-video { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; z-index: 0; }
      #fx-canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; z-index: 1; }
      #ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="lenticular" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <video id="bg-video" muted playsinline></video>
      <canvas id="fx-canvas" width="1920" height="1080"></canvas>
      <div id="ui-layer"></div>
      <div id="driver" class="clip" data-start="0" data-duration="8" data-track-index="0"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;"></div>
    </div>
    <script>
    (function() {
      var root = document.getElementById('root');
      var video = document.getElementById('bg-video');
      video.src = root.dataset.videoSrc || '../../assets/sample.mp4';
      video.load();
      var canvas = document.getElementById('fx-canvas');
      var gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });
      window.__timelines = window.__timelines || {};
      if (!gl) {
        window.__timelines['lenticular'] = gsap.timeline({ paused: true });
        return;
      }
      gl.viewport(0, 0, 1920, 1080);

      var vertSrc =
        'attribute vec2 a_pos; varying vec2 v_uv; void main(){' +
        'v_uv = a_pos * 0.5 + 0.5; v_uv.y = 1.0 - v_uv.y; gl_Position = vec4(a_pos, 0.0, 1.0);}';

      var fragSrc =
        'precision mediump float;' +
        'varying vec2 v_uv;' +
        'uniform sampler2D u_video;' +
        'uniform float u_time;' +
        'uniform vec2 u_resolution;' +
        'void main() {' +
        '  vec2 px = v_uv * u_resolution;' +
        '  float lensWidth = 6.0;' +
        '  float lensPos = mod(px.x, lensWidth) / lensWidth;' +
        '  float viewAngle = sin(u_time * 0.3) * 0.5 + 0.5;' +
        '  float shift = (lensPos - 0.5) * 16.0 * (viewAngle - 0.5);' +
        '  vec2 shiftedUV = vec2((px.x + shift) / u_resolution.x, v_uv.y);' +
        '  shiftedUV = clamp(shiftedUV, 0.0, 1.0);' +
        '  vec4 col = texture2D(u_video, shiftedUV);' +
        '  float edgeDark = smoothstep(0.0, 0.06, lensPos) * smoothstep(1.0, 0.94, lensPos);' +
        '  col.rgb *= 0.92 + edgeDark * 0.08;' +
        '  float fringe = 0.003;' +
        '  float r = texture2D(u_video, clamp(shiftedUV + vec2(fringe, 0.0), 0.0, 1.0)).r;' +
        '  float b = texture2D(u_video, clamp(shiftedUV - vec2(fringe, 0.0), 0.0, 1.0)).b;' +
        '  col.r = mix(col.r, r, 0.4);' +
        '  col.b = mix(col.b, b, 0.4);' +
        '  gl_FragColor = vec4(clamp(col.rgb, 0.0, 1.0), 1.0);' +
        '}';

      var quadBuf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

      function compileShader(src, type) {
        var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error('lenticular:', gl.getShaderInfoLog(s));
        return s;
      }
      function mkProg(fSrc) {
        var p = gl.createProgram();
        gl.attachShader(p, compileShader(vertSrc, gl.VERTEX_SHADER));
        gl.attachShader(p, compileShader(fSrc, gl.FRAGMENT_SHADER));
        gl.linkProgram(p);
        if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error('lenticular link:', gl.getProgramInfoLog(p));
        return p;
      }

      var prog = mkProg(fragSrc);
      var uVideo      = gl.getUniformLocation(prog, 'u_video');
      var uTime       = gl.getUniformLocation(prog, 'u_time');
      var uResolution = gl.getUniformLocation(prog, 'u_resolution');

      var videoTex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, videoTex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));

      gl.useProgram(prog);
      gl.uniform2f(uResolution, 1920.0, 1080.0);

      function draw(t) {
        if (video.readyState >= 2) {
          gl.bindTexture(gl.TEXTURE_2D, videoTex);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
        }
        gl.useProgram(prog);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, videoTex);
        gl.uniform1i(uVideo, 0);
        gl.uniform1f(uTime, t);
        var pos = gl.getAttribLocation(prog, 'a_pos');
        gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
        gl.enableVertexAttribArray(pos);
        gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }

      draw(0);
      var tl = gsap.timeline({ paused: true, onUpdate: function(){ draw(tl.time() * (window.__params && window.__params.speed !== undefined ? window.__params.speed : 1.0)); } });
      tl.to({ t: 0 }, { t: 8, duration: 8, ease: 'none' }, 0);
      window.__timelines['lenticular'] = tl;
    })();
    </script>
  </body>
</html>
