<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
    [data-composition-id] { width: 1920px; height: 1080px; overflow: hidden; position: relative; }
    #bg-video { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; display: none; }
    #fx-canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; z-index: 1; }
    #ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
  </style>
</head>
<body>
  <div id="root"
    data-composition-id="long-exposure"
    data-start="0"
    data-duration="8"
    data-width="1920"
    data-height="1080">

    <video id="bg-video" muted playsinline></video>
    <canvas id="fx-canvas" width="1920" height="1080"></canvas>
    <div id="ui-layer"></div>

    <div class="clip"
      data-start="0"
      data-duration="8"
      data-track-index="0"
      style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;">
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};

    var video = document.getElementById('bg-video');
    video.src = document.getElementById('root').dataset.videoSrc || '../../assets/sample.mp4';

    var canvas = document.getElementById('fx-canvas');
    var gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });

    if (!gl) {
      console.warn('WebGL not available');
      window.__timelines['long-exposure'] = gsap.timeline({ paused: true });
    } else {
      gl.viewport(0, 0, 1920, 1080);

      var vertSrc = 'attribute vec2 a_pos;varying vec2 v_uv;void main(){v_uv=a_pos*.5+.5;v_uv.y=1.-v_uv.y;gl_Position=vec4(a_pos,0,1);}';
      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

      function compile(src, type) {
        var s = gl.createShader(type);
        gl.shaderSource(s, src); gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
        return s;
      }
      function mkProg(frag) {
        var p = gl.createProgram();
        gl.attachShader(p, compile(vertSrc, gl.VERTEX_SHADER));
        gl.attachShader(p, compile(frag, gl.FRAGMENT_SHADER));
        gl.linkProgram(p); return p;
      }
      function mkTex() {
        var t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));
        return t;
      }
      function makeFBO(w, h) {
        var t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
        gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        var fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
        gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        return { tex: t, fb: fb };
      }
      function draw(prog) {
        var loc = gl.getAttribLocation(prog, 'a_pos');
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }

      var vTex = mkTex();
      var accumFBO = makeFBO(1920, 1080);

      // Clear accumulation buffer to black
      gl.bindFramebuffer(gl.FRAMEBUFFER, accumFBO.fb);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);

      var accumFrag =
        'precision mediump float;' +
        'varying vec2 v_uv;' +
        'uniform sampler2D u_current;' +
        'uniform sampler2D u_accum;' +
        'uniform float u_blend;' +
        'void main(){' +
        '  vec4 curr=texture2D(u_current,v_uv);' +
        '  vec4 acc=texture2D(u_accum,v_uv);' +
        '  gl_FragColor=mix(acc,curr,u_blend);' +
        '}';

      var displayFrag =
        'precision mediump float;' +
        'varying vec2 v_uv;' +
        'uniform sampler2D u_accum;' +
        'vec3 filmic(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}' +
        'void main(){' +
        '  vec4 c=texture2D(u_accum,v_uv);' +
        '  float luma=dot(c.rgb,vec3(0.299,0.587,0.114));' +
        '  c.rgb=mix(vec3(luma),c.rgb,0.75);' +
        '  c.rgb+=vec3(-0.005,0.0,0.012)*luma;' +
        '  c.rgb=filmic(c.rgb);' +
        '  float vignette=length(v_uv-0.5)*1.4;' +
        '  c.rgb*=1.0-smoothstep(0.45,1.0,vignette)*0.25;' +
        '  gl_FragColor=vec4(c.rgb,1.0);' +
        '}';

      var accumProg   = mkProg(accumFrag);
      var displayProg = mkProg(displayFrag);

      var uAccumCurrent = gl.getUniformLocation(accumProg, 'u_current');
      var uAccumPrev    = gl.getUniformLocation(accumProg, 'u_accum');
      var uAccumBlend   = gl.getUniformLocation(accumProg, 'u_blend');
      var uDisplayAccum = gl.getUniformLocation(displayProg, 'u_accum');

      // Ping-pong: we need a second FBO to render accumulation into
      var accumFBO2 = makeFBO(1920, 1080);
      gl.bindFramebuffer(gl.FRAMEBUFFER, accumFBO2.fb);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);

      var readFBO  = accumFBO;
      var writeFBO = accumFBO2;

      var proxy = { t: 0, prev: 0 };

      var tl = gsap.timeline({ paused: true,
        onUpdate: function() {
          var dt = proxy.t - proxy.prev;
          proxy.prev = proxy.t;

          // Upload current video frame
          if (video.readyState >= 2) {
            gl.bindTexture(gl.TEXTURE_2D, vTex);
            gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);
          }

          // Run accumulation steps
          var steps = Math.max(1, Math.floor(Math.abs(dt) * 24));
          for (var i = 0; i < steps; i++) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, writeFBO.fb);
            gl.viewport(0, 0, 1920, 1080);
            gl.useProgram(accumProg);
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, vTex);
            gl.uniform1i(uAccumCurrent, 0);
            gl.activeTexture(gl.TEXTURE1);
            gl.bindTexture(gl.TEXTURE_2D, readFBO.tex);
            gl.uniform1i(uAccumPrev, 1);
            gl.uniform1f(uAccumBlend, (window.__params.blend !== undefined ? window.__params.blend : 0.055));
            draw(accumProg);
            // Swap
            var tmp = readFBO; readFBO = writeFBO; writeFBO = tmp;
          }

          // Display pass
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.viewport(0, 0, 1920, 1080);
          gl.useProgram(displayProg);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, readFBO.tex);
          gl.uniform1i(uDisplayAccum, 0);
          draw(displayProg);
        }
      });

      tl.to(proxy, { t: 8, duration: 8, ease: 'none' }, 0);

      window.__timelines['long-exposure'] = tl;
    }
  </script>
</body>
</html>
