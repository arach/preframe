<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      [data-composition-id] { width: 1920px; height: 1080px; overflow: hidden; position: relative; }
      #bg-video { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; z-index: 0; }
      #fx-canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; z-index: 1; }
      #ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="pixel-sort" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <video id="bg-video" muted playsinline></video>
      <canvas id="fx-canvas" width="1920" height="1080"></canvas>
      <div id="ui-layer"></div>
      <div class="clip" data-start="0" data-duration="8" data-track-index="0"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;"></div>
    </div>

    <script>
    (function () {
      var root     = document.getElementById('root');
      var video    = document.getElementById('bg-video');
      var fxCanvas = document.getElementById('fx-canvas');
      var fxCtx    = fxCanvas.getContext('2d');

      video.src = root.dataset.videoSrc || '../../assets/sample.mp4';
      video.load();

      // Working canvas at ½ resolution — fast enough, less pixelated than ¼
      var W = 960, H = 540;
      var offscreen = document.createElement('canvas');
      offscreen.width = W;
      offscreen.height = H;
      var offCtx = offscreen.getContext('2d');

      function draw(t) {
        if (video.readyState < 2) return;

        offCtx.drawImage(video, 0, 0, W, H);
        var imgData = offCtx.getImageData(0, 0, W, H);
        var data = imgData.data;

        // Sort band sweeps top → bottom over 8s, then wraps
        var progress   = (t % 8) / 8;
        var bandTop    = Math.floor(H * progress);
        var bandHeight = Math.floor(H * (window.__params && window.__params.band_size !== undefined ? window.__params.band_size : 0.25));
        var bandEnd    = Math.min(bandTop + bandHeight, H);

        for (var row = bandTop; row < bandEnd; row++) {
          var base = row * W * 4;
          var pixels = [];
          for (var col = 0; col < W; col++) {
            var i = base + col * 4;
            var r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
            pixels.push({ r: r, g: g, b: b, a: a, luma: 0.299*r + 0.587*g + 0.114*b });
          }
          pixels.sort(function (a, b) { return a.luma - b.luma; });
          for (var col = 0; col < W; col++) {
            var i = base + col * 4;
            data[i]   = pixels[col].r;
            data[i+1] = pixels[col].g;
            data[i+2] = pixels[col].b;
            data[i+3] = pixels[col].a;
          }
        }

        offCtx.putImageData(imgData, 0, 0);
        fxCtx.drawImage(offscreen, 0, 0, 1920, 1080);
      }

      draw(0);

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true, onUpdate: function () { draw(tl.time()); } });
      tl.to({ _: 0 }, { _: 1, duration: 8, ease: 'none' }, 0);
      window.__timelines['pixel-sort'] = tl;
    })();
    </script>
  </body>
</html>
