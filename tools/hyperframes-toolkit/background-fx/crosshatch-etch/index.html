<!-- hyperframes-registry-item: crosshatch-etch -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      [data-composition-id] { width: 1920px; height: 1080px; overflow: hidden; position: relative; }
      #bg-video { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; z-index: 0; }
      #fx-canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; z-index: 1; }
      #ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="crosshatch-etch" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <video id="bg-video" muted playsinline></video>
      <canvas id="fx-canvas" width="1920" height="1080"></canvas>
      <div id="ui-layer"></div>
      <div id="driver" class="clip" data-start="0" data-duration="8" data-track-index="0"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;"></div>
    </div>
    <script>
      (function() {
        var root = document.getElementById('root');
        var video = document.getElementById('bg-video');
        video.src = root.dataset.videoSrc || '../../assets/sample.mp4';
        var canvas = document.getElementById('fx-canvas');
        var gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });
        window.__timelines = window.__timelines || {};
        if (!gl) {
          console.warn('crosshatch-etch: WebGL not available');
          window.__timelines['crosshatch-etch'] = gsap.timeline({ paused: true });
          return;
        }
        gl.viewport(0, 0, 1920, 1080);

        var vertSrc = 'attribute vec2 a_pos; varying vec2 v_uv; void main(){v_uv = a_pos * 0.5 + 0.5; v_uv.y = 1.0 - v_uv.y; gl_Position = vec4(a_pos, 0.0, 1.0);}';

        var fragSrc =
          'precision mediump float;' +
          'varying vec2 v_uv;' +
          'uniform sampler2D u_video;' +
          'uniform float u_time;' +
          'uniform vec2 u_resolution;' +
          'void main() {' +
          '  vec4 col = texture2D(u_video, v_uv);' +
          '  float lum = dot(col.rgb, vec3(0.299, 0.587, 0.114));' +
          '  vec2 px = v_uv * u_resolution;' +
          '  float spacing = 8.0 + sin(u_time * 0.3) * 0.5;' +
          '  float lw = 0.15;' +
          '  float ink = 0.0;' +
          '  if (lum < 0.8) { float s = px.y / spacing; if (fract(s) < lw) ink = 1.0; }' +
          '  if (lum < 0.6) { float s = (px.x + px.y) / (spacing * 1.414); if (fract(s) < lw) ink = 1.0; }' +
          '  if (lum < 0.4) { float s = px.x / spacing; if (fract(s) < lw) ink = 1.0; }' +
          '  if (lum < 0.2) { float s = (px.x - px.y) / (spacing * 1.414); if (fract(s) < lw) ink = 1.0; }' +
          '  vec3 paper = vec3(0.96, 0.93, 0.85);' +
          '  vec3 inkCol = col.rgb * 0.3 + vec3(0.05, 0.04, 0.03) * 0.7;' +
          '  vec3 etch = mix(paper, inkCol, ink);' +
          '  gl_FragColor = vec4(mix(etch, col.rgb, 0.3), 1.0);' +
          '}';

        var quadBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

        function compileShader(src, type) {
          var s = gl.createShader(type);
          gl.shaderSource(s, src); gl.compileShader(s);
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error('crosshatch-etch shader:', gl.getShaderInfoLog(s));
          return s;
        }
        function mkProg(fSrc) {
          var p = gl.createProgram();
          gl.attachShader(p, compileShader(vertSrc, gl.VERTEX_SHADER));
          gl.attachShader(p, compileShader(fSrc, gl.FRAGMENT_SHADER));
          gl.linkProgram(p);
          if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error('crosshatch-etch link:', gl.getProgramInfoLog(p));
          return p;
        }

        var prog = mkProg(fragSrc);
        var videoTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, videoTex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));

        function draw(t) {
          if (video.readyState >= 2) {
            gl.bindTexture(gl.TEXTURE_2D, videoTex);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
          }
          gl.useProgram(prog);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, videoTex);
          gl.uniform1i(gl.getUniformLocation(prog, 'u_video'), 0);
          gl.uniform1f(gl.getUniformLocation(prog, 'u_time'), t);
          gl.uniform2f(gl.getUniformLocation(prog, 'u_resolution'), 1920.0, 1080.0);
          var pos = gl.getAttribLocation(prog, 'a_pos');
          gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
          gl.enableVertexAttribArray(pos);
          gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }

        draw(0);
        var tl = gsap.timeline({ paused: true, onUpdate: function(){ draw(tl.time() * (window.__params && window.__params.speed !== undefined ? window.__params.speed : 1.0)); } });
        tl.to({ t: 0 }, { t: 8, duration: 8, ease: 'none' }, 0);
        window.__timelines['crosshatch-etch'] = tl;
      })();
    </script>
  </body>
</html>
