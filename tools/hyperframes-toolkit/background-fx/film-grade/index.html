<!-- hyperframes-registry-item: film-grade -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      [data-composition-id] { width: 1920px; height: 1080px; overflow: hidden; position: relative; }
      #bg-video {
        position: absolute; inset: 0;
        width: 1920px; height: 1080px;
        object-fit: cover; z-index: 0;
      }
      #fx-canvas {
        position: absolute; inset: 0;
        width: 1920px; height: 1080px;
        pointer-events: none; z-index: 1;
      }
      #ui-layer {
        position: absolute; inset: 0;
        z-index: 10; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="film-grade"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <video id="bg-video" muted playsinline></video>
      <canvas id="fx-canvas" width="1920" height="1080"></canvas>
      <div id="ui-layer"></div>

      <div
        id="driver"
        class="clip"
        data-start="0"
        data-duration="8"
        data-track-index="0"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;"
      ></div>
    </div>

    <script>
      (function () {
        var root = document.getElementById('root');
        var videoSrc = root.dataset.videoSrc || '../../assets/sample.mp4';
        var video = document.getElementById('bg-video');
        video.src = videoSrc;
        video.load();

        var canvas = document.getElementById('fx-canvas');
        var gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });

        if (!gl) {
          console.warn('film-grade: WebGL not available');
          window.__timelines = window.__timelines || {};
          window.__timelines['film-grade'] = gsap.timeline({ paused: true });
          return;
        }

        gl.viewport(0, 0, 1920, 1080);

        var vertSrc =
          'attribute vec2 a_pos; varying vec2 v_uv; void main(){' +
          'v_uv = a_pos * 0.5 + 0.5; v_uv.y = 1.0 - v_uv.y; gl_Position = vec4(a_pos, 0.0, 1.0);}';

        var fragSrc =
          'precision mediump float;' +
          'varying vec2 v_uv;' +
          'uniform sampler2D u_video;' +
          'uniform float u_time;' +
          'uniform vec2 u_resolution;' +
          'vec3 aces(vec3 x){' +
          '  return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0);}' +
          'float hash(vec2 p){' +
          '  return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}' +
          'void main(){' +
          '  vec4 col=texture2D(u_video,v_uv);' +
          '  col.r += col.r*0.08 - col.b*0.04;' +
          '  col.b += (1.0-col.b)*0.06 - col.r*0.02;' +
          '  col.g -= 0.02;' +
          '  col.rgb=aces(col.rgb*1.1);' +
          '  vec2 grainUV=v_uv*u_resolution/2.0;' +
          '  float grain=(hash(grainUV+fract(u_time*17.0))-0.5)*0.04;' +
          '  col.rgb+=grain;' +
          '  float vDist=length(v_uv-0.5)*1.5;' +
          '  float vignette=1.0-smoothstep(0.4,1.0,vDist);' +
          '  col.rgb*=vignette;' +
          '  col.rgb=col.rgb*0.95+0.02;' +
          '  gl_FragColor=vec4(clamp(col.rgb,0.0,1.0),1.0);}';

        var quadBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

        function compileShader(src, type) {
          var s = gl.createShader(type);
          gl.shaderSource(s, src); gl.compileShader(s);
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error('film-grade shader:', gl.getShaderInfoLog(s));
          return s;
        }
        function mkProg(fSrc) {
          var p = gl.createProgram();
          gl.attachShader(p, compileShader(vertSrc, gl.VERTEX_SHADER));
          gl.attachShader(p, compileShader(fSrc, gl.FRAGMENT_SHADER));
          gl.linkProgram(p);
          if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error('film-grade link:', gl.getProgramInfoLog(p));
          return p;
        }

        var prog = mkProg(fragSrc);
        var uVideo      = gl.getUniformLocation(prog, 'u_video');
        var uTime       = gl.getUniformLocation(prog, 'u_time');
        var uResolution = gl.getUniformLocation(prog, 'u_resolution');

        var videoTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, videoTex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));

        // Set resolution once
        gl.useProgram(prog);
        gl.uniform2f(uResolution, 1920.0, 1080.0);

        function uploadVideoFrame() {
          if (video.readyState >= 2) {
            gl.bindTexture(gl.TEXTURE_2D, videoTex);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
          }
        }

        function draw(t) {
          uploadVideoFrame();
          gl.useProgram(prog);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, videoTex);
          gl.uniform1i(uVideo, 0);
          gl.uniform1f(uTime, t);
          var pos = gl.getAttribLocation(prog, 'a_pos');
          gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
          gl.enableVertexAttribArray(pos);
          gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }

        draw(0);

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({
          paused: true,
          onUpdate: function () { draw(tl.time()); }
        });
        tl.to({ t: 0 }, { t: 8, duration: 8, ease: 'none' }, 0);
        window.__timelines['film-grade'] = tl;
      })();

        // Parameter control bridge
        window.__params = window.__params || {};
        window.__setParam = function(name, value) { window.__params[name] = value; };
        window.addEventListener('message', function(e) {
          if (e.data && e.data.type === 'fx-param') window.__params[e.data.name] = e.data.value;
        });
    </script>
  </body>
</html>
