<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
    [data-composition-id] { width: 1920px; height: 1080px; overflow: hidden; position: relative; }
    #bg-video { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; display: none; }
    #fx-canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; z-index: 1; }
    #ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="bloom-halation" data-start="0" data-duration="8" data-width="1920" data-height="1080">
    <video id="bg-video" muted playsinline></video>
    <canvas id="fx-canvas" width="1920" height="1080"></canvas>
    <div id="ui-layer"></div>
    <div class="clip" data-start="0" data-duration="8" data-track-index="0"
         style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    var video = document.getElementById('bg-video');
    video.src = document.getElementById('root').dataset.videoSrc || '../../assets/sample.mp4';
    var canvas = document.getElementById('fx-canvas');
    var gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });
    gl.viewport(0, 0, 1920, 1080);

    var vertSrc = 'attribute vec2 a_pos;varying vec2 v_uv;void main(){v_uv=a_pos*.5+.5;v_uv.y=1.-v_uv.y;gl_Position=vec4(a_pos,0,1);}';
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

    function compile(src, type) {
      var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
      return s;
    }
    function mkProg(frag) {
      var p = gl.createProgram();
      gl.attachShader(p, compile(vertSrc, gl.VERTEX_SHADER));
      gl.attachShader(p, compile(frag, gl.FRAGMENT_SHADER));
      gl.linkProgram(p); return p;
    }
    function mkTex() {
      var t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));
      return t;
    }
    function upload(tex) {
      if (video.readyState >= 2) {
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
      }
    }
    function bindAndDraw(prog) {
      var loc = gl.getAttribLocation(prog, 'a_pos');
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    var vTex = mkTex();

    // FBO for glow pass
    function makeFBO(w, h) {
      var tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      var fb = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      return { tex: tex, fb: fb };
    }
    var glowFBO = makeFBO(1920, 1080);

    var glowFrag = [
      'precision mediump float;',
      'varying vec2 v_uv;',
      'uniform sampler2D u_video;',
      'uniform vec2 u_texel;',
      'void main(){',
      '  vec4 c=texture2D(u_video,v_uv);',
      '  float luma=dot(c.rgb,vec3(0.299,0.587,0.114));',
      '  float bright=smoothstep(0.55,0.85,luma);',
      '  vec3 blur=vec3(0.0);float w=0.0;',
      '  for(int x=-2;x<=2;x++)for(int y=-2;y<=2;y++){',
      '    float wt=1.0/(1.0+float(x*x+y*y));',
      '    blur+=texture2D(u_video,v_uv+vec2(float(x)*u_texel.x*18.,float(y)*u_texel.y*18.)).rgb*wt;',
      '    w+=wt;',
      '  }',
      '  blur/=w;',
      '  float blurLuma=dot(blur,vec3(0.299,0.587,0.114));',
      '  float blurBright=smoothstep(0.45,0.75,blurLuma);',
      '  gl_FragColor=vec4(blur*blurBright,1.0);',
      '}'
    ].join('\n');

    var compositeFrag = [
      'precision mediump float;',
      'varying vec2 v_uv;',
      'uniform sampler2D u_video;',
      'uniform sampler2D u_glow;',
      'uniform float u_strength;',
      'void main(){',
      '  vec4 video=texture2D(u_video,v_uv);',
      '  vec4 glow=texture2D(u_glow,v_uv);',
      '  vec3 warmGlow=clamp(glow.rgb*vec3(1.1,0.85,0.55)*1.6,0.,1.);',
      '  vec3 screened=1.0-(1.0-video.rgb)*(1.0-warmGlow*u_strength);',
      '  float videoLuma=dot(video.rgb,vec3(0.299,0.587,0.114));',
      '  vec3 lift=vec3(0.03,0.02,0.01)*smoothstep(0.5,1.0,videoLuma)*u_strength;',
      '  gl_FragColor=vec4(clamp(screened+lift,0.,1.),1.0);',
      '}'
    ].join('\n');

    var progGlow = mkProg(glowFrag);
    var progComposite = mkProg(compositeFrag);

    gl.useProgram(progGlow);
    gl.uniform2f(gl.getUniformLocation(progGlow, 'u_texel'), 1/1920, 1/1080);

    var proxy = { strength: 0 };
    var tl = gsap.timeline({ paused: true,
      onUpdate: function() {
        upload(vTex);

        // Pass 1: glow into FBO
        gl.bindFramebuffer(gl.FRAMEBUFFER, glowFBO.fb);
        gl.viewport(0, 0, 1920, 1080);
        gl.useProgram(progGlow);
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, vTex);
        gl.uniform1i(gl.getUniformLocation(progGlow, 'u_video'), 0);
        bindAndDraw(progGlow);

        // Pass 2: composite to screen
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 1920, 1080);
        gl.useProgram(progComposite);
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, vTex);
        gl.uniform1i(gl.getUniformLocation(progComposite, 'u_video'), 0);
        gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, glowFBO.tex);
        gl.uniform1i(gl.getUniformLocation(progComposite, 'u_glow'), 1);
        gl.uniform1f(gl.getUniformLocation(progComposite, 'u_strength'), (window.__params.strength !== undefined ? window.__params.strength : proxy.strength));
        bindAndDraw(progComposite);
      }
    });
    tl.to(proxy, { strength: 0.9, duration: 2, ease: 'power2.inOut' }, 0);
    tl.to(proxy, { strength: 0.9, duration: 6 }, 2); // hold
    window.__timelines['bloom-halation'] = tl;
  </script>
</body>
</html>
