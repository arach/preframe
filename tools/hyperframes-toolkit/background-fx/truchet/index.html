<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
    [data-composition-id] { width: 1920px; height: 1080px; overflow: hidden; position: relative; }
    #bg-video {
      position: absolute; inset: 0;
      width: 1920px; height: 1080px;
      object-fit: cover; z-index: 0;
    }
    #fx-canvas {
      position: absolute; top: 0; left: 0;
      width: 1920px; height: 1080px;
      pointer-events: none; z-index: 2;
    }
    #ui-layer {
      position: absolute; inset: 0;
      pointer-events: none; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="root"
    data-composition-id="truchet"
    data-start="0"
    data-duration="8"
    data-width="1920"
    data-height="1080"
  >
    <video id="bg-video" muted playsinline></video>
    <canvas id="fx-canvas" width="1920" height="1080"></canvas>
    <div id="ui-layer"></div>

    <div class="clip"
      data-start="0"
      data-duration="8"
      data-track-index="0"
      style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;"
    ></div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};

    var root = document.getElementById('root');
    var video = document.getElementById('bg-video');
    video.src = root.dataset.videoSrc || '../../assets/sample.mp4';

    var canvas = document.getElementById('fx-canvas');
    var ctx = canvas.getContext('2d');

    var COLS = 48, ROWS = 27;
    var TW = 1920 / COLS;   // 40px
    var TH = 1080 / ROWS;   // 40px

    function makeLCG(seed) {
      var s = seed;
      return function() { s = (1664525 * s + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; };
    }
    var rng = makeLCG(999);

    var tiles = [];
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        tiles.push({
          base:     rng() > 0.5 ? 1 : 0,
          flips:    rng() < 0.3,
          flipTime: rng() * 8.0
        });
      }
    }

    function tileOrientation(tile, t) {
      if (tile.flips && t >= tile.flipTime) return 1 - tile.base;
      return tile.base;
    }

    function drawTile(x, y, w, h, orientation) {
      var r = Math.min(w, h);
      ctx.beginPath();
      if (orientation === 0) {
        ctx.arc(x,   y,   r, 0,           Math.PI / 2);
        ctx.moveTo(x + w, y + h);
        ctx.arc(x+w, y+h, r, Math.PI,     3 * Math.PI / 2);
      } else {
        ctx.arc(x+w, y,   r, Math.PI / 2, Math.PI);
        ctx.moveTo(x, y + h);
        ctx.arc(x,   y+h, r, 3*Math.PI/2, 0);
      }
      ctx.stroke();
    }

    function draw(t) {
      ctx.clearRect(0, 0, 1920, 1080);
      ctx.strokeStyle = 'rgba(255,255,255,' + (window.__params && window.__params.opacity !== undefined ? window.__params.opacity : 0.18) + ')';
      ctx.lineWidth = window.__params && window.__params.line_width !== undefined ? window.__params.line_width : 1.5;
      ctx.globalCompositeOperation = 'overlay';

      for (var i = 0; i < tiles.length; i++) {
        var row = Math.floor(i / COLS);
        var col = i % COLS;
        var x = col * TW;
        var y = row * TH;
        var orient = tileOrientation(tiles[i], t);
        drawTile(x, y, TW, TH, orient);
      }
    }

    var proxy = { t: 0 };
    var tl = gsap.timeline({ paused: true,
      onUpdate: function() { draw(proxy.t); }
    });
    tl.to(proxy, { t: 8, duration: 8, ease: 'none' }, 0);
    window.__timelines['truchet'] = tl;
  </script>
</body>
</html>
