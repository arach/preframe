<!-- hyperframes-registry-item: chromatic-flow -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      [data-composition-id] { width: 1920px; height: 1080px; overflow: hidden; position: relative; }
      #bg-video {
        position: absolute; inset: 0;
        width: 1920px; height: 1080px;
        object-fit: cover; z-index: 0;
      }
      #fx-canvas {
        position: absolute; inset: 0;
        width: 1920px; height: 1080px;
        pointer-events: none; z-index: 1;
      }
      #ui-layer {
        position: absolute; inset: 0;
        z-index: 10; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="chromatic-flow"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <video id="bg-video" muted playsinline></video>
      <canvas id="fx-canvas" width="1920" height="1080"></canvas>
      <div id="ui-layer"></div>

      <div
        id="driver"
        class="clip"
        data-start="0"
        data-duration="8"
        data-track-index="0"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;"
      ></div>
    </div>

    <script>
      (function () {
        var root = document.getElementById('root');
        var videoSrc = root.dataset.videoSrc || '../../assets/sample.mp4';
        var video = document.getElementById('bg-video');
        video.src = videoSrc;
        video.load();

        var canvas = document.getElementById('fx-canvas');
        var gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });

        if (!gl) {
          console.warn('chromatic-flow: WebGL not available');
          window.__timelines = window.__timelines || {};
          window.__timelines['chromatic-flow'] = gsap.timeline({ paused: true });
          return;
        }

        gl.viewport(0, 0, 1920, 1080);

        var vertSrc =
          'attribute vec2 a_pos; varying vec2 v_uv; void main(){' +
          'v_uv = a_pos * 0.5 + 0.5; v_uv.y = 1.0 - v_uv.y; gl_Position = vec4(a_pos, 0.0, 1.0);}';

        var fragSrc =
          'precision mediump float;' +
          'varying vec2 v_uv;' +
          'uniform sampler2D u_video;' +
          'uniform float u_shift;' +
          'void main(){' +
          '  float radial=length(v_uv-0.5)*2.0;' +
          '  float s=u_shift*radial;' +
          '  vec2 dir=normalize(v_uv-0.5+vec2(0.0001));' +
          '  float r=texture2D(u_video,clamp(v_uv+dir*s,0.0,1.0)).r;' +
          '  float g=texture2D(u_video,v_uv).g;' +
          '  float b=texture2D(u_video,clamp(v_uv-dir*s,0.0,1.0)).b;' +
          '  gl_FragColor=vec4(r,g,b,1.0);}';

        var quadBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

        function compileShader(src, type) {
          var s = gl.createShader(type);
          gl.shaderSource(s, src); gl.compileShader(s);
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error('chromatic-flow shader:', gl.getShaderInfoLog(s));
          return s;
        }
        function mkProg(fSrc) {
          var p = gl.createProgram();
          gl.attachShader(p, compileShader(vertSrc, gl.VERTEX_SHADER));
          gl.attachShader(p, compileShader(fSrc, gl.FRAGMENT_SHADER));
          gl.linkProgram(p);
          if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error('chromatic-flow link:', gl.getProgramInfoLog(p));
          return p;
        }

        var prog = mkProg(fragSrc);
        var uVideo = gl.getUniformLocation(prog, 'u_video');
        var uShift = gl.getUniformLocation(prog, 'u_shift');

        var videoTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, videoTex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));

        function uploadVideoFrame() {
          if (video.readyState >= 2) {
            gl.bindTexture(gl.TEXTURE_2D, videoTex);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
          }
        }

        var proxy = { shift: 0.0 };

        function draw() {
          uploadVideoFrame();
          gl.useProgram(prog);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, videoTex);
          gl.uniform1i(uVideo, 0);
          gl.uniform1f(uShift, (window.__params.shift !== undefined ? window.__params.shift : proxy.shift));
          var pos = gl.getAttribLocation(prog, 'a_pos');
          gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
          gl.enableVertexAttribArray(pos);
          gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }

        draw();

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({
          paused: true,
          onUpdate: function () { draw(); }
        });

        // Baked breathing cycle: 0→max→0→max→0 across 8s
        tl.fromTo(proxy, { shift: 0.0 }, { shift: 0.005, duration: 2, ease: 'sine.inOut' }, 0);
        tl.fromTo(proxy, { shift: 0.005 }, { shift: 0.0,   duration: 2, ease: 'sine.inOut' }, 2);
        tl.fromTo(proxy, { shift: 0.0 },   { shift: 0.005, duration: 2, ease: 'sine.inOut' }, 4);
        tl.fromTo(proxy, { shift: 0.005 }, { shift: 0.0,   duration: 2, ease: 'sine.inOut' }, 6);

        window.__timelines['chromatic-flow'] = tl;
      })();
    </script>
  </body>
</html>
