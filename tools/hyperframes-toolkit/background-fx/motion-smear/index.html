<!-- hyperframes-registry-item: motion-smear -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      [data-composition-id] { width: 1920px; height: 1080px; overflow: hidden; position: relative; }
      #bg-video { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; z-index: 0; }
      #fx-canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; z-index: 1; }
      #ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="motion-smear" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <video id="bg-video" muted playsinline></video>
      <canvas id="fx-canvas" width="1920" height="1080"></canvas>
      <div id="ui-layer"></div>
      <div id="driver" class="clip" data-start="0" data-duration="8" data-track-index="0"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;"></div>
    </div>
    <script>
    (function() {
      var root = document.getElementById('root');
      var video = document.getElementById('bg-video');
      video.src = root.dataset.videoSrc || '../../assets/sample.mp4';
      video.load();
      var canvas = document.getElementById('fx-canvas');
      var gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });
      window.__timelines = window.__timelines || {};
      if (!gl) {
        window.__timelines['motion-smear'] = gsap.timeline({ paused: true });
        return;
      }
      gl.viewport(0, 0, 1920, 1080);

      var vertSrc = 'attribute vec2 a_pos; varying vec2 v_uv; void main(){v_uv = a_pos * 0.5 + 0.5; v_uv.y = 1.0 - v_uv.y; gl_Position = vec4(a_pos, 0.0, 1.0);}';

      var accumFrag =
        'precision mediump float;' +
        'varying vec2 v_uv;' +
        'uniform sampler2D u_video;' +
        'uniform sampler2D u_trail;' +
        'uniform float u_decay;' +
        'void main(){' +
        '  vec4 cur = texture2D(u_video, v_uv);' +
        '  vec4 trail = texture2D(u_trail, v_uv);' +
        '  gl_FragColor = mix(trail, cur, u_decay);' +
        '}';

      var dispFrag =
        'precision mediump float;' +
        'varying vec2 v_uv;' +
        'uniform sampler2D u_trail;' +
        'void main(){' +
        '  gl_FragColor = texture2D(u_trail, v_uv);' +
        '}';

      var quadBuf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

      function compileShader(src, type) {
        var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error('motion-smear:', gl.getShaderInfoLog(s));
        return s;
      }
      function mkProg(fSrc) {
        var p = gl.createProgram();
        gl.attachShader(p, compileShader(vertSrc, gl.VERTEX_SHADER));
        gl.attachShader(p, compileShader(fSrc, gl.FRAGMENT_SHADER));
        gl.linkProgram(p);
        if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error('motion-smear link:', gl.getProgramInfoLog(p));
        return p;
      }
      function makeTarget() {
        var tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1920, 1080, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        var fb = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        return { tex: tex, fb: fb };
      }
      function bindQuad(prog) {
        var pos = gl.getAttribLocation(prog, 'a_pos');
        gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
        gl.enableVertexAttribArray(pos);
        gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
      }

      var progAccum = mkProg(accumFrag);
      var progDisp = mkProg(dispFrag);
      var ping = makeTarget();
      var pong = makeTarget();

      var videoTex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, videoTex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));

      var prevT = 0;

      function draw(t) {
        if (video.readyState >= 2) {
          gl.bindTexture(gl.TEXTURE_2D, videoTex);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
        }
        var dt = Math.abs(t - prevT);
        prevT = t;
        var decay = Math.min(1.0, dt * 4.0 + 0.05);

        gl.bindFramebuffer(gl.FRAMEBUFFER, pong.fb);
        gl.viewport(0, 0, 1920, 1080);
        gl.useProgram(progAccum);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, videoTex);
        gl.uniform1i(gl.getUniformLocation(progAccum, 'u_video'), 0);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, ping.tex);
        gl.uniform1i(gl.getUniformLocation(progAccum, 'u_trail'), 1);
        gl.uniform1f(gl.getUniformLocation(progAccum, 'u_decay'), (window.__params.decay !== undefined ? window.__params.decay : decay));
        bindQuad(progAccum);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        var tmp = ping; ping = pong; pong = tmp;

        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 1920, 1080);
        gl.useProgram(progDisp);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, ping.tex);
        gl.uniform1i(gl.getUniformLocation(progDisp, 'u_trail'), 0);
        bindQuad(progDisp);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }

      draw(0);
      var tl = gsap.timeline({ paused: true, onUpdate: function(){ draw(tl.time()); } });
      tl.to({ t: 0 }, { t: 8, duration: 8, ease: 'none' }, 0);
      window.__timelines['motion-smear'] = tl;
    })();
    </script>
  </body>
</html>
