<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
    [data-composition-id] { width: 1920px; height: 1080px; overflow: hidden; position: relative; }
    #bg-video { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; display: none; }
    #fx-canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; z-index: 1; }
    #ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
  </style>
</head>
<body>
  <div id="root"
    data-composition-id="orton-effect"
    data-start="0"
    data-duration="8"
    data-width="1920"
    data-height="1080">

    <video id="bg-video" muted playsinline></video>
    <canvas id="fx-canvas" width="1920" height="1080"></canvas>
    <div id="ui-layer"></div>

    <div class="clip"
      data-start="0"
      data-duration="8"
      data-track-index="0"
      style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;">
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};

    var video = document.getElementById('bg-video');
    video.src = document.getElementById('root').dataset.videoSrc || '../../assets/sample.mp4';

    var canvas = document.getElementById('fx-canvas');
    var gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });

    if (!gl) {
      console.warn('WebGL not available');
      window.__timelines['orton-effect'] = gsap.timeline({ paused: true });
    } else {
      gl.viewport(0, 0, 1920, 1080);

      var vertSrc = 'attribute vec2 a_pos;varying vec2 v_uv;void main(){v_uv=a_pos*.5+.5;v_uv.y=1.-v_uv.y;gl_Position=vec4(a_pos,0,1);}';
      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

      function compile(src, type) {
        var s = gl.createShader(type);
        gl.shaderSource(s, src); gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
        return s;
      }
      function mkProg(frag) {
        var p = gl.createProgram();
        gl.attachShader(p, compile(vertSrc, gl.VERTEX_SHADER));
        gl.attachShader(p, compile(frag, gl.FRAGMENT_SHADER));
        gl.linkProgram(p); return p;
      }
      function mkTex() {
        var t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));
        return t;
      }
      function makeFBO(w, h) {
        var t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
        gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        var fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
        gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        return { tex: t, fb: fb };
      }
      function draw(prog) {
        var loc = gl.getAttribLocation(prog, 'a_pos');
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }

      var vTex = mkTex();
      var blurFBO = makeFBO(1920, 1080);

      var blurFrag =
        'precision mediump float;' +
        'varying vec2 v_uv;' +
        'uniform sampler2D u_video;' +
        'uniform vec2 u_texel;' +
        'void main(){' +
        '  vec4 sum=vec4(0.0);' +
        '  float r=12.0;' +
        '  sum+=texture2D(u_video,v_uv+vec2(-r,-r)*u_texel)*0.077;' +
        '  sum+=texture2D(u_video,v_uv+vec2( 0,-r)*u_texel)*0.077;' +
        '  sum+=texture2D(u_video,v_uv+vec2( r,-r)*u_texel)*0.077;' +
        '  sum+=texture2D(u_video,v_uv+vec2(-r, 0)*u_texel)*0.077;' +
        '  sum+=texture2D(u_video,v_uv             )*0.231;' +
        '  sum+=texture2D(u_video,v_uv+vec2( r, 0)*u_texel)*0.077;' +
        '  sum+=texture2D(u_video,v_uv+vec2(-r, r)*u_texel)*0.077;' +
        '  sum+=texture2D(u_video,v_uv+vec2( 0, r)*u_texel)*0.077;' +
        '  sum+=texture2D(u_video,v_uv+vec2( r, r)*u_texel)*0.077;' +
        '  gl_FragColor=clamp(sum*1.8,0.0,1.0);' +
        '}';

      var compositeFrag =
        'precision mediump float;' +
        'varying vec2 v_uv;' +
        'uniform sampler2D u_sharp;' +
        'uniform sampler2D u_blurred;' +
        'uniform float u_strength;' +
        'void main(){' +
        '  vec4 sharp=texture2D(u_sharp,v_uv);' +
        '  vec4 blurred=texture2D(u_blurred,v_uv);' +
        '  vec3 multiplied=sharp.rgb*blurred.rgb;' +
        '  vec3 result=mix(sharp.rgb,multiplied*1.4,u_strength);' +
        '  float glowLuma=dot(blurred.rgb,vec3(0.299,0.587,0.114));' +
        '  result+=vec3(0.03,0.01,-0.01)*glowLuma*u_strength;' +
        '  gl_FragColor=vec4(clamp(result,0.0,1.0),1.0);' +
        '}';

      var blurProg = mkProg(blurFrag);
      var compositeProg = mkProg(compositeFrag);

      var uBlurVideo   = gl.getUniformLocation(blurProg, 'u_video');
      var uBlurTexel   = gl.getUniformLocation(blurProg, 'u_texel');
      var uCompSharp   = gl.getUniformLocation(compositeProg, 'u_sharp');
      var uCompBlurred = gl.getUniformLocation(compositeProg, 'u_blurred');
      var uCompStrength= gl.getUniformLocation(compositeProg, 'u_strength');

      var proxy = { strength: 0 };

      var tl = gsap.timeline({ paused: true,
        onUpdate: function() {
          // Upload video frame
          if (video.readyState >= 2) {
            gl.bindTexture(gl.TEXTURE_2D, vTex);
            gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);
          }

          // Pass 1: blur into blurFBO
          gl.bindFramebuffer(gl.FRAMEBUFFER, blurFBO.fb);
          gl.viewport(0, 0, 1920, 1080);
          gl.useProgram(blurProg);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, vTex);
          gl.uniform1i(uBlurVideo, 0);
          gl.uniform2f(uBlurTexel, 1.0/1920.0, 1.0/1080.0);
          draw(blurProg);

          // Pass 2: composite to screen
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.viewport(0, 0, 1920, 1080);
          gl.useProgram(compositeProg);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, vTex);
          gl.uniform1i(uCompSharp, 0);
          gl.activeTexture(gl.TEXTURE1);
          gl.bindTexture(gl.TEXTURE_2D, blurFBO.tex);
          gl.uniform1i(uCompBlurred, 1);
          gl.uniform1f(uCompStrength, (window.__params.strength !== undefined ? window.__params.strength : proxy.strength));
          draw(compositeProg);
        }
      });

      tl.to(proxy, { strength: 0.85, duration: 2.5, ease: 'power2.inOut' }, 0);
      tl.to(proxy, { strength: 0.85, duration: 5.5 }, 2.5); // hold

      window.__timelines['orton-effect'] = tl;
    }
  </script>
</body>
</html>
