<!-- hyperframes-registry-item: holographic -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      [data-composition-id] { width: 1920px; height: 1080px; overflow: hidden; position: relative; }
      #bg-video {
        position: absolute; inset: 0;
        width: 1920px; height: 1080px;
        object-fit: cover; z-index: 0;
      }
      #fx-canvas {
        position: absolute; inset: 0;
        width: 1920px; height: 1080px;
        pointer-events: none; z-index: 1;
      }
      #ui-layer {
        position: absolute; inset: 0;
        z-index: 10; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="holographic"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <video id="bg-video" muted playsinline></video>
      <canvas id="fx-canvas" width="1920" height="1080"></canvas>
      <div id="ui-layer"></div>

      <div
        id="driver"
        class="clip"
        data-start="0"
        data-duration="8"
        data-track-index="0"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;"
      ></div>
    </div>

    <script>
      (function () {
        var root = document.getElementById('root');
        var videoSrc = root.dataset.videoSrc || '../../assets/sample.mp4';
        var video = document.getElementById('bg-video');
        video.src = videoSrc;
        video.load();

        var canvas = document.getElementById('fx-canvas');
        var gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });

        if (!gl) {
          console.warn('holographic: WebGL not available');
          window.__timelines = window.__timelines || {};
          window.__timelines['holographic'] = gsap.timeline({ paused: true });
          return;
        }

        gl.viewport(0, 0, 1920, 1080);

        var vertSrc =
          'attribute vec2 a_pos; varying vec2 v_uv; void main(){' +
          'v_uv = a_pos * 0.5 + 0.5; v_uv.y = 1.0 - v_uv.y; gl_Position = vec4(a_pos, 0.0, 1.0);}';

        var fragSrc =
          'precision mediump float;' +
          'varying vec2 v_uv;' +
          'uniform sampler2D u_video;' +
          'uniform float u_time;' +
          'uniform float u_intensity;' +
          'uniform float u_saturation;' +
          'uniform float u_angle_speed;' +
          'vec3 hsv2rgb(vec3 c){' +
          '  vec4 K=vec4(1.0,2.0/3.0,1.0/3.0,3.0);' +
          '  vec3 p=abs(fract(c.xxx+K.xyz)*6.0-K.www);' +
          '  return c.z*mix(K.xxx,clamp(p-K.xxx,0.0,1.0),c.y);}' +
          'void main(){' +
          '  vec4 videoCol=texture2D(u_video,v_uv);' +
          '  float angle=atan(v_uv.y-0.5,v_uv.x-0.5);' +
          '  float dist=length(v_uv-0.5);' +
          '  float hue=fract(angle/(2.0*3.14159)+dist*0.8+u_time*0.05*u_angle_speed);' +
          '  float luma=dot(videoCol.rgb,vec3(0.299,0.587,0.114));' +
          '  float iriSat=smoothstep(0.2,0.8,luma)*0.7*u_saturation;' +
          '  vec3 rainbow=hsv2rgb(vec3(hue,clamp(iriSat,0.0,1.0),1.0));' +
          '  vec3 blended=1.0-(1.0-videoCol.rgb)*(1.0-rainbow*0.3*u_intensity);' +
          '  gl_FragColor=vec4(blended,1.0);}';

        var quadBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

        function compileShader(src, type) {
          var s = gl.createShader(type);
          gl.shaderSource(s, src); gl.compileShader(s);
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error('holographic shader:', gl.getShaderInfoLog(s));
          return s;
        }
        function mkProg(fSrc) {
          var p = gl.createProgram();
          gl.attachShader(p, compileShader(vertSrc, gl.VERTEX_SHADER));
          gl.attachShader(p, compileShader(fSrc, gl.FRAGMENT_SHADER));
          gl.linkProgram(p);
          if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error('holographic link:', gl.getProgramInfoLog(p));
          return p;
        }

        var prog = mkProg(fragSrc);
        var uVideo = gl.getUniformLocation(prog, 'u_video');
        var uTime  = gl.getUniformLocation(prog, 'u_time');
        var uIntensity = gl.getUniformLocation(prog, 'u_intensity');
        var uSaturation = gl.getUniformLocation(prog, 'u_saturation');
        var uAngleSpeed = gl.getUniformLocation(prog, 'u_angle_speed');

        var videoTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, videoTex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));

        function uploadVideoFrame() {
          if (video.readyState >= 2) {
            gl.bindTexture(gl.TEXTURE_2D, videoTex);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
          }
        }

        function draw(t) {
          uploadVideoFrame();
          gl.useProgram(prog);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, videoTex);
          gl.uniform1i(uVideo, 0);
          gl.uniform1f(uTime, t);
          gl.uniform1f(uIntensity, (window.__params && window.__params.intensity !== undefined ? window.__params.intensity : 1.0));
          gl.uniform1f(uSaturation, (window.__params && window.__params.saturation !== undefined ? window.__params.saturation : 1.0));
          gl.uniform1f(uAngleSpeed, (window.__params && window.__params.angle_speed !== undefined ? window.__params.angle_speed : 1.0));
          var pos = gl.getAttribLocation(prog, 'a_pos');
          gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
          gl.enableVertexAttribArray(pos);
          gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }

        draw(0);

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({
          paused: true,
          onUpdate: function () { draw(tl.time() * (window.__params && window.__params.speed !== undefined ? window.__params.speed : 1.0)); }
        });
        tl.to({ t: 0 }, { t: 8, duration: 8, ease: 'none' }, 0);
        window.__timelines['holographic'] = tl;
      })();

        // Parameter control bridge
        window.__params = window.__params || {};
        window.__setParam = function(name, value) { window.__params[name] = value; };
        window.addEventListener('message', function(e) {
          if (e.data && e.data.type === 'fx-param') window.__params[e.data.name] = e.data.value;
        });
    </script>
  </body>
</html>
