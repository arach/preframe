<!-- hyperframes-registry-item: prism-dispersion -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      [data-composition-id] { width: 1920px; height: 1080px; overflow: hidden; position: relative; }
      #bg-video { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; z-index: 0; }
      #fx-canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; z-index: 1; }
      #ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="prism-dispersion" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <video id="bg-video" muted playsinline></video>
      <canvas id="fx-canvas" width="1920" height="1080"></canvas>
      <div id="ui-layer"></div>
      <div id="driver" class="clip" data-start="0" data-duration="8" data-track-index="0"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;"></div>
    </div>
    <script>
      (function() {
        var root = document.getElementById('root');
        var video = document.getElementById('bg-video');
        video.src = root.dataset.videoSrc || '../../assets/sample.mp4';
        var canvas = document.getElementById('fx-canvas');
        var gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });
        window.__timelines = window.__timelines || {};
        if (!gl) {
          console.warn('prism-dispersion: WebGL not available');
          window.__timelines['prism-dispersion'] = gsap.timeline({ paused: true });
          return;
        }
        gl.viewport(0, 0, 1920, 1080);
        var vertSrc = 'attribute vec2 a_pos; varying vec2 v_uv; void main(){v_uv = a_pos * 0.5 + 0.5; v_uv.y = 1.0 - v_uv.y; gl_Position = vec4(a_pos, 0.0, 1.0);}';
        var fragSrc =
          'precision mediump float;' +
          'varying vec2 v_uv;' +
          'uniform sampler2D u_video;' +
          'uniform float u_time;' +
          'uniform vec2 u_resolution;' +
          'uniform float u_shift_amount;' +
          'uniform float u_rainbow_strength;' +
          'uniform float u_radial_bias;' +
          'void main() {' +
          '  vec2 dir = v_uv - 0.5;' +
          '  float dist = length(dir);' +
          '  if (dist > 0.001) dir = normalize(dir); else dir = vec2(0.0);' +
          '  float disp = dist * 0.022 * u_shift_amount * (1.0 + sin(u_time * 0.35) * 0.25);' +
          '  float r = texture2D(u_video, clamp(v_uv + dir * disp * 1.2, 0.0, 1.0)).r;' +
          '  float g = texture2D(u_video, clamp(v_uv + dir * disp * 0.4, 0.0, 1.0)).g;' +
          '  float b = texture2D(u_video, clamp(v_uv - dir * disp * 0.8, 0.0, 1.0)).b;' +
          '  float angle = atan(dir.y, dir.x) / 3.14159 * 0.5 + 0.5;' +
          '  float fringeStrength = smoothstep(u_radial_bias, u_radial_bias + 0.4, dist) * 0.15;' +
          '  vec3 rainbow;' +
          '  float h = fract(angle + u_time * 0.05);' +
          '  float hh = h * 6.0;' +
          '  float f = fract(hh);' +
          '  if (hh < 1.0)      rainbow = vec3(1.0, f, 0.0);' +
          '  else if (hh < 2.0) rainbow = vec3(1.0-f, 1.0, 0.0);' +
          '  else if (hh < 3.0) rainbow = vec3(0.0, 1.0, f);' +
          '  else if (hh < 4.0) rainbow = vec3(0.0, 1.0-f, 1.0);' +
          '  else if (hh < 5.0) rainbow = vec3(f, 0.0, 1.0);' +
          '  else               rainbow = vec3(1.0, 0.0, 1.0-f);' +
          '  vec3 col = vec3(r, g, b);' +
          '  col = mix(col, col + rainbow * 0.5 * u_rainbow_strength, fringeStrength);' +
          '  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);' +
          '}';
        var quadBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
        function compileShader(src, type) {
          var s = gl.createShader(type);
          gl.shaderSource(s, src); gl.compileShader(s);
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error('prism-dispersion shader:', gl.getShaderInfoLog(s));
          return s;
        }
        function mkProg(fSrc) {
          var p = gl.createProgram();
          gl.attachShader(p, compileShader(vertSrc, gl.VERTEX_SHADER));
          gl.attachShader(p, compileShader(fSrc, gl.FRAGMENT_SHADER));
          gl.linkProgram(p);
          if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error('prism-dispersion link:', gl.getProgramInfoLog(p));
          return p;
        }
        var prog = mkProg(fragSrc);
        var videoTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, videoTex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));
        function draw(t) {
          if (video.readyState >= 2) {
            gl.bindTexture(gl.TEXTURE_2D, videoTex);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
          }
          gl.useProgram(prog);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, videoTex);
          gl.uniform1i(gl.getUniformLocation(prog, 'u_video'), 0);
          gl.uniform1f(gl.getUniformLocation(prog, 'u_time'), t);
          gl.uniform2f(gl.getUniformLocation(prog, 'u_resolution'), 1920.0, 1080.0);
          gl.uniform1f(gl.getUniformLocation(prog, 'u_shift_amount'), (window.__params && window.__params.shift_amount !== undefined ? window.__params.shift_amount : 1.0));
          gl.uniform1f(gl.getUniformLocation(prog, 'u_rainbow_strength'), (window.__params && window.__params.rainbow_strength !== undefined ? window.__params.rainbow_strength : 1.0));
          gl.uniform1f(gl.getUniformLocation(prog, 'u_radial_bias'), (window.__params && window.__params.radial_bias !== undefined ? window.__params.radial_bias : 0.3));
          var pos = gl.getAttribLocation(prog, 'a_pos');
          gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
          gl.enableVertexAttribArray(pos);
          gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }
        draw(0);
        var tl = gsap.timeline({ paused: true, onUpdate: function(){ draw(tl.time() * (window.__params && window.__params.speed !== undefined ? window.__params.speed : 1.0)); } });
        tl.to({ t: 0 }, { t: 8, duration: 8, ease: 'none' }, 0);
        window.__timelines['prism-dispersion'] = tl;
      })();
        window.__params = window.__params || {};
        window.__setParam = function(name, value) { window.__params[name] = value; };
        window.addEventListener('message', function(e) {
          if (e.data && e.data.type === 'fx-param') window.__params[e.data.name] = e.data.value;
        });
    </script>
  </body>
</html>
