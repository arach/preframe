<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      [data-composition-id] { width: 1920px; height: 1080px; overflow: hidden; position: relative; }
      #bg-video { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; z-index: 0; }
      #fx-canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; z-index: 1; }
      #ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="vj-feedback" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <video id="bg-video" muted playsinline></video>
      <canvas id="fx-canvas" width="1920" height="1080"></canvas>
      <div id="ui-layer"></div>
      <div class="clip" data-start="0" data-duration="8" data-track-index="0"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;"></div>
    </div>

    <script>
    (function () {
      var root   = document.getElementById('root');
      var video  = document.getElementById('bg-video');
      var canvas = document.getElementById('fx-canvas');

      video.src = root.dataset.videoSrc || '../../assets/sample.mp4';
      video.load();

      var gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });
      window.__timelines = window.__timelines || {};

      if (!gl) {
        window.__timelines['vj-feedback'] = gsap.timeline({ paused: true });
        return;
      }

      gl.viewport(0, 0, 1920, 1080);

      var vertSrc =
        'attribute vec2 a_pos; varying vec2 v_uv; void main(){' +
        'v_uv=a_pos*0.5+0.5; v_uv.y=1.0-v_uv.y; gl_Position=vec4(a_pos,0.0,1.0);}';

      function compileShader(src, type) {
        var s = gl.createShader(type);
        gl.shaderSource(s, src); gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error('vj-feedback shader:', gl.getShaderInfoLog(s));
        return s;
      }
      function mkProg(fragSrc) {
        var p = gl.createProgram();
        gl.attachShader(p, compileShader(vertSrc, gl.VERTEX_SHADER));
        gl.attachShader(p, compileShader(fragSrc, gl.FRAGMENT_SHADER));
        gl.linkProgram(p);
        if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error('vj-feedback link:', gl.getProgramInfoLog(p));
        return p;
      }

      var quadBuf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

      function bindQuad(prog) {
        var pos = gl.getAttribLocation(prog, 'a_pos');
        gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
        gl.enableVertexAttribArray(pos);
        gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
      }

      // Feedback buffers
      var FW = 960, FH = 540;
      function makeFBO(w, h) {
        var tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        var fb = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
        return { tex: tex, fb: fb };
      }
      var ping = makeFBO(FW, FH);
      var pong = makeFBO(FW, FH);

      // Init: warm grey (not black) so the tunnel is visible immediately
      [ping, pong].forEach(function (fbo) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo.fb);
        gl.clearColor(0.08, 0.06, 0.12, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
      });
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);

      // Video texture
      var videoTex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, videoTex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));

      function uploadVideo() {
        if (video.readyState >= 2) {
          gl.bindTexture(gl.TEXTURE_2D, videoTex);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
        }
      }

      // Feedback shader: scale + rotate previous buffer, add video
      var feedProg = mkProg(
        'precision mediump float;' +
        'varying vec2 v_uv;' +
        'uniform sampler2D u_prev;' +
        'uniform sampler2D u_video;' +
        'uniform float u_scale;' +
        'uniform float u_rot;' +
        'uniform float u_decay;' +
        'void main(){' +
        '  vec2 p=v_uv-0.5;' +
        '  float cs=cos(-u_rot),sn=sin(-u_rot);' +
        '  p=vec2(cs*p.x-sn*p.y,sn*p.x+cs*p.y)/u_scale+0.5;' +
        '  vec4 prev=texture2D(u_prev,clamp(p,0.0,1.0))*u_decay;' +
        '  vec4 vid=texture2D(u_video,v_uv)*0.18;' +
        '  gl_FragColor=clamp(prev+vid,0.0,1.0);' +
        '}'
      );
      var feedLoc = {
        prev:  gl.getUniformLocation(feedProg, 'u_prev'),
        video: gl.getUniformLocation(feedProg, 'u_video'),
        scale: gl.getUniformLocation(feedProg, 'u_scale'),
        rot:   gl.getUniformLocation(feedProg, 'u_rot'),
        decay: gl.getUniformLocation(feedProg, 'u_decay')
      };

      // Display shader: screen-blend feedback over video
      var dispProg = mkProg(
        'precision mediump float;' +
        'varying vec2 v_uv;' +
        'uniform sampler2D u_feedback;' +
        'uniform sampler2D u_video;' +
        'void main(){' +
        '  vec4 feed=texture2D(u_feedback,v_uv);' +
        '  vec4 vid=texture2D(u_video,v_uv);' +
        '  vec3 result=1.0-(1.0-vid.rgb)*(1.0-feed.rgb*1.5);' +
        '  gl_FragColor=vec4(clamp(result,0.0,1.0),1.0);' +
        '}'
      );
      var dispLoc = {
        feedback: gl.getUniformLocation(dispProg, 'u_feedback'),
        video:    gl.getUniformLocation(dispProg, 'u_video')
      };

      function feedStep() {
        gl.bindFramebuffer(gl.FRAMEBUFFER, pong.fb);
        gl.viewport(0, 0, FW, FH);
        gl.useProgram(feedProg);
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, ping.tex);
        gl.uniform1i(feedLoc.prev, 0);
        gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, videoTex);
        gl.uniform1i(feedLoc.video, 1);
        gl.uniform1f(feedLoc.scale, (window.__params.zoom !== undefined ? window.__params.zoom : 1.014));
        gl.uniform1f(feedLoc.rot,   (window.__params.rotation !== undefined ? window.__params.rotation : 0.010));
        gl.uniform1f(feedLoc.decay, (window.__params.decay !== undefined ? window.__params.decay : 0.94));
        bindQuad(feedProg);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        var tmp = ping; ping = pong; pong = tmp;
      }

      function renderDisplay() {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 1920, 1080);
        gl.useProgram(dispProg);
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, ping.tex);
        gl.uniform1i(dispLoc.feedback, 0);
        gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, videoTex);
        gl.uniform1i(dispLoc.video, 1);
        bindQuad(dispProg);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }

      // Pre-warm: 60 steps so the tunnel is visible from frame 1
      for (var i = 0; i < 60; i++) feedStep();
      renderDisplay();

      var tl = gsap.timeline({
        paused: true,
        onUpdate: function () {
          uploadVideo();
          feedStep();
          renderDisplay();
        }
      });
      tl.to({ _: 0 }, { _: 1, duration: 8, ease: 'none' }, 0);
      window.__timelines['vj-feedback'] = tl;
    })();
    </script>
  </body>
</html>
