<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Glitch Frame Overlay</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
    }

    /* Root frame container */
    #glitch-root {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
    }

    /* Three layered frames for RGB split */
    .frame-layer {
      position: absolute;
      inset: 0;
    }

    .frame-layer .edge {
      position: absolute;
      background: currentColor;
    }
    .frame-layer .edge.top    { top: 0;    left: 0;    right: 0;  height: 3px; }
    .frame-layer .edge.bottom { bottom: 0; left: 0;    right: 0;  height: 3px; }
    .frame-layer .edge.left   { left: 0;   top: 0;     bottom: 0; width:  3px; }
    .frame-layer .edge.right  { right: 0;  top: 0;     bottom: 0; width:  3px; }

    /* Corner brackets — L-shapes, 2vw */
    .corner {
      position: absolute;
      width: 2vw;
      height: 2vw;
      color: currentColor;
      pointer-events: none;
    }
    .corner .ch {
      position: absolute;
      height: 3px;
      width: 100%;
      background: currentColor;
      box-shadow: 0 0 6px currentColor;
    }
    .corner .cv {
      position: absolute;
      width: 3px;
      height: 100%;
      background: currentColor;
      box-shadow: 0 0 6px currentColor;
    }
    .corner-tl { top: 0;    left: 0;  }
    .corner-tl .ch { top: 0; left: 0; }
    .corner-tl .cv { top: 0; left: 0; }

    .corner-tr { top: 0;    right: 0; }
    .corner-tr .ch { top: 0; right: 0; left: auto; }
    .corner-tr .cv { top: 0; right: 0; left: auto; }

    .corner-bl { bottom: 0; left: 0;  }
    .corner-bl .ch { bottom: 0; top: auto; left: 0; }
    .corner-bl .cv { bottom: 0; top: auto; left: 0; }

    .corner-br { bottom: 0; right: 0; }
    .corner-br .ch { bottom: 0; top: auto; right: 0; left: auto; }
    .corner-br .cv { bottom: 0; top: auto; right: 0; left: auto; }

    #layer-r { color: #ff3333; mix-blend-mode: screen; opacity: 0.75; transform: translateX(-2px); }
    #layer-g { color: #ffffff; mix-blend-mode: screen; opacity: 0.85; }
    #layer-b { color: #3366ff; mix-blend-mode: screen; opacity: 0.75; transform: translateX(2px);  }
  </style>
</head>
<body>

  <div id="glitch-root">
    <div class="frame-layer" id="layer-r">
      <div class="edge top"></div>
      <div class="edge bottom"></div>
      <div class="edge left"></div>
      <div class="edge right"></div>
    </div>
    <div class="frame-layer" id="layer-g">
      <div class="edge top"></div>
      <div class="edge bottom"></div>
      <div class="edge left"></div>
      <div class="edge right"></div>
      <!-- Corners only on the green (center) layer for crispness -->
      <div class="corner corner-tl"><div class="ch"></div><div class="cv"></div></div>
      <div class="corner corner-tr"><div class="ch"></div><div class="cv"></div></div>
      <div class="corner corner-bl"><div class="ch"></div><div class="cv"></div></div>
      <div class="corner corner-br"><div class="ch"></div><div class="cv"></div></div>
    </div>
    <div class="frame-layer" id="layer-b">
      <div class="edge top"></div>
      <div class="edge bottom"></div>
      <div class="edge left"></div>
      <div class="edge right"></div>
    </div>
  </div>

<script>
(function registerHFTimeline() {
  if (typeof gsap === 'undefined') return;
  const tl = gsap.timeline({ paused: true });
  tl.set({}, {}, 60);
  window.__timelines = window.__timelines || {};
  window.__timelines['glitch-frame'] = tl;
  window.__hf = { seek: t => tl.seek(t), duration: tl.duration() * 1000 };
})();

function loadHFVariables() {
  try {
    const vars = window.__hyperframes?.getVariables?.() ?? window.__hfVariables ?? {};
    if (vars.spec) return JSON.parse(typeof vars.spec === 'string' ? vars.spec : JSON.stringify(vars.spec));
  } catch {}
  return null;
}

const root   = document.getElementById('glitch-root');
const layerR = document.getElementById('layer-r');
const layerG = document.getElementById('layer-g');
const layerB = document.getElementById('layer-b');

let glitchLoop = null;
let shimmerTween = null;

let spec = { enabled: false, color: '#00ff88', intensity: 0.6 };

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return { r, g, b };
}

function scheduleGlitch(intensity) {
  if (glitchLoop) clearTimeout(glitchLoop);
  // Min interval shortens with higher intensity
  const minDelay = 2000 - intensity * 1200; // 800ms–2000ms
  const maxDelay = 4000 - intensity * 1500; // 2500ms–4000ms
  const delay = minDelay + Math.random() * (maxDelay - minDelay);

  glitchLoop = setTimeout(() => {
    if (!spec.enabled) return;
    const shiftY = (Math.random() > 0.5 ? 1 : -1) * (3 + Math.random() * 6);
    // Flash jump then snap back — 3 quick frames at 16ms each
    gsap.timeline()
      .set(root, { y: shiftY })
      .set(root, { y: -shiftY * 0.4 }, '+=0.016')
      .set(root, { y: 0 }, '+=0.016')
      // Also briefly boost R/B separation
      .set(layerR, { x: -(4 + Math.random() * 5) }, '<')
      .set(layerB, { x:  (4 + Math.random() * 5) }, '<')
      .to(layerR,  { x: -2, duration: 0.1 }, '+=0.05')
      .to(layerB,  { x:  2, duration: 0.1 }, '<');

    scheduleGlitch(intensity);
  }, delay);
}

function applySpec(s, animate = true) {
  spec = Object.assign({}, spec, s);

  const intensity = Math.max(0, Math.min(1, spec.intensity ?? 0.6));
  const color     = spec.color || '#00ff88';
  const rgb       = hexToRgb(color);

  // Tint: blend the base color into R/G/B channels
  layerR.style.color = `rgb(${Math.round(rgb.r * 0.8 + 255 * 0.2)}, ${Math.round(rgb.g * 0.15)}, ${Math.round(rgb.b * 0.15)})`;
  layerG.style.color = color;
  layerB.style.color = `rgb(${Math.round(rgb.r * 0.15)}, ${Math.round(rgb.g * 0.15)}, ${Math.round(rgb.b * 0.8 + 255 * 0.2)})`;

  const targetOpacity = intensity;

  if (!spec.enabled) {
    gsap.to(root, { opacity: 0, duration: 0.3, ease: 'power2.in' });
    if (glitchLoop) { clearTimeout(glitchLoop); glitchLoop = null; }
    if (shimmerTween) { shimmerTween.kill(); shimmerTween = null; }
  } else {
    if (animate && gsap.getProperty(root, 'opacity') < 0.05) {
      gsap.fromTo(root, { opacity: 0 }, { opacity: targetOpacity, duration: 0.35, ease: 'power2.out' });
    } else {
      gsap.to(root, { opacity: targetOpacity, duration: 0.25 });
    }

    // Slow shimmer: opacity oscillates ±0.1 every 3s
    if (shimmerTween) shimmerTween.kill();
    shimmerTween = gsap.to(root, {
      opacity: targetOpacity - 0.1,
      duration: 1.5,
      ease: 'sine.inOut',
      yoyo: true,
      repeat: -1,
    });

    scheduleGlitch(intensity);
  }
}

(function init() {
  const injected = loadHFVariables();
  if (injected) spec = Object.assign(spec, injected);
  applySpec(spec, false);
})();

window.addEventListener('message', ({ data }) => {
  if (!data) return;
  if (data.type === 'composition-spec') applySpec(data.spec, data.animate !== false);
});
</script>
</body>
</html>
