<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Version Stamp Overlay</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
    }

    #stamp {
      position: absolute;
      padding: 0.7vw 1.2vw;
      border: 1px solid rgba(255, 255, 255, 0.10);
      opacity: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 0.2vw;
    }

    #stamp-app {
      font-family: ui-monospace, monospace;
      font-size: clamp(8px, 0.85vw, 18px);
      font-weight: 600;
      color: rgba(255, 255, 255, 0.60);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    #stamp-version {
      font-family: ui-monospace, monospace;
      font-size: clamp(8px, 0.85vw, 18px);
      font-weight: 400;
      color: var(--accent, #4ade80);
      letter-spacing: 0.05em;
    }

    #stamp-date {
      font-family: ui-monospace, monospace;
      font-size: clamp(7px, 0.75vw, 16px);
      font-weight: 400;
      color: rgba(255, 255, 255, 0.25);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div id="stamp">
    <div id="stamp-app">LATTICES</div>
    <div id="stamp-version">v2.1.0</div>
    <div id="stamp-date">2026-05-09</div>
  </div>

<script>
(function registerHFTimeline() {
  if (typeof gsap === 'undefined') return;
  const tl = gsap.timeline({ paused: true });
  tl.set({}, {}, 60);
  window.__timelines = window.__timelines || {};
  window.__timelines['version-stamp'] = tl;
  window.__hf = { seek: t => tl.seek(t), duration: tl.duration() * 1000 };
})();

function loadHFVariables() {
  try {
    const vars = window.__hyperframes?.getVariables?.() ?? window.__hfVariables ?? {};
    if (vars.spec) return JSON.parse(typeof vars.spec === 'string' ? vars.spec : JSON.stringify(vars.spec));
  } catch {}
  return null;
}

const stampEl      = document.getElementById('stamp');
const stampAppEl   = document.getElementById('stamp-app');
const stampVerEl   = document.getElementById('stamp-version');
const stampDateEl  = document.getElementById('stamp-date');

const MARGIN = '2.5vw';

const CORNER_STYLES = {
  'top-right':    { top: MARGIN, right: MARGIN, left: 'auto', bottom: 'auto' },
  'top-left':     { top: MARGIN, left: MARGIN, right: 'auto', bottom: 'auto' },
  'bottom-right': { bottom: MARGIN, right: MARGIN, left: 'auto', top: 'auto' },
  'bottom-left':  { bottom: MARGIN, left: MARGIN, right: 'auto', top: 'auto' },
};

let spec = { app: 'LATTICES', version: 'v2.1.0', date: '2026-05-09', corner: 'top-right', accentColor: '#4ade80', enabled: false };

function applySpec(s, animate = true) {
  spec = Object.assign({}, spec, s);

  const accent = spec.accentColor || '#4ade80';
  document.documentElement.style.setProperty('--accent', accent);
  stampVerEl.style.color = accent;

  stampAppEl.textContent  = spec.app     || '';
  stampVerEl.textContent  = spec.version || '';
  stampDateEl.textContent = spec.date    || '';

  // Position stamp in correct corner
  const corner = CORNER_STYLES[spec.corner] || CORNER_STYLES['top-right'];
  Object.assign(stampEl.style, { top: '', right: '', bottom: '', left: '' });
  Object.assign(stampEl.style, corner);

  if (!spec.enabled) {
    gsap.to(stampEl, { opacity: 0, duration: 0.35, ease: 'power2.in' });
  } else if (animate && gsap.getProperty(stampEl, 'opacity') < 0.05) {
    gsap.fromTo(stampEl, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power2.out' });
  } else {
    gsap.to(stampEl, { opacity: 1, duration: 0.2 });
  }
}

(function init() {
  const injected = loadHFVariables();
  if (injected) spec = Object.assign(spec, injected);
  applySpec(spec, false);
})();

window.addEventListener('message', ({ data }) => {
  if (!data) return;
  if (data.type === 'composition-spec') applySpec(data.spec, data.animate !== false);
});
</script>
</body>
</html>
