<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Interview Ident Overlay</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
    }

    #ident {
      position: absolute;
      left: 8vw;
      bottom: 10vh;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 0;
      opacity: 0;
      transform: translateY(1.5vh);
      pointer-events: none;
    }

    #accent-bar {
      width: 2px;
      background: var(--accent, #4ade80);
      box-shadow: 0 0 8px var(--accent, #4ade80);
      margin-right: 1.2vw;
      border-radius: 1px;
      transform-origin: top center;
      transform: scaleY(0);
    }

    #text-block {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    #ident-name {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: clamp(14px, 2.8vw, 72px);
      font-weight: 700;
      color: #f2f2f2;
      line-height: 1.1;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 24px rgba(0,0,0,0.9);
    }

    #ident-rule {
      width: 100%;
      height: 1px;
      background: var(--accent, #4ade80);
      opacity: 0.3;
      margin: 0.5vw 0;
      transform: scaleX(0);
      transform-origin: left center;
    }

    #ident-role {
      font-family: ui-monospace, monospace;
      font-size: clamp(8px, 1.1vw, 26px);
      font-weight: 400;
      color: rgba(242, 242, 242, 0.55);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      text-shadow: 0 1px 12px rgba(0,0,0,0.9);
    }
  </style>
</head>
<body>

  <div id="ident">
    <div id="accent-bar"></div>
    <div id="text-block">
      <div id="ident-name">Jane Smith</div>
      <div id="ident-rule"></div>
      <div id="ident-role">Lead Designer</div>
    </div>
  </div>

<script>
(function registerHFTimeline() {
  if (typeof gsap === 'undefined') return;
  const tl = gsap.timeline({ paused: true });
  tl.set({}, {}, 60);
  window.__timelines = window.__timelines || {};
  window.__timelines['interview-ident'] = tl;
  window.__hf = { seek: t => tl.seek(t), duration: tl.duration() * 1000 };
})();

function loadHFVariables() {
  try {
    const vars = window.__hyperframes?.getVariables?.() ?? window.__hfVariables ?? {};
    if (vars.spec) return JSON.parse(typeof vars.spec === 'string' ? vars.spec : JSON.stringify(vars.spec));
  } catch {}
  return null;
}

const identEl   = document.getElementById('ident');
const accentBar = document.getElementById('accent-bar');
const nameEl    = document.getElementById('ident-name');
const ruleEl    = document.getElementById('ident-rule');
const roleEl    = document.getElementById('ident-role');

let spec = { name: 'Jane Smith', role: 'Lead Designer', accentColor: '#4ade80', enabled: false };

function applySpec(s, animate = true) {
  spec = Object.assign({}, spec, s);

  const accent = spec.accentColor || '#4ade80';
  document.documentElement.style.setProperty('--accent', accent);
  accentBar.style.background = accent;
  accentBar.style.boxShadow  = `0 0 8px ${accent}`;
  ruleEl.style.background    = accent;

  nameEl.textContent = spec.name || '';
  roleEl.textContent = spec.role || '';

  const wasHidden = gsap.getProperty(identEl, 'opacity') < 0.05;

  if (!spec.enabled) {
    gsap.to(identEl, { opacity: 0, y: '1.5vh', duration: 0.3, ease: 'power2.in' });
    gsap.to(accentBar, { scaleY: 0, duration: 0.2, transformOrigin: 'top center' });
    gsap.to(ruleEl, { scaleX: 0, duration: 0.2, transformOrigin: 'left center' });
  } else if (animate && wasHidden) {
    // Accent bar draws height first, then text slides up
    gsap.set(accentBar, { scaleY: 0 });
    gsap.set(ruleEl, { scaleX: 0 });
    gsap.fromTo(identEl,
      { opacity: 0, y: '1.5vh' },
      { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }
    );
    gsap.to(accentBar, { scaleY: 1, duration: 0.45, ease: 'power2.out', delay: 0.1, transformOrigin: 'top center' });
    gsap.to(ruleEl, { scaleX: 1, duration: 0.35, ease: 'power2.out', delay: 0.25, transformOrigin: 'left center' });
  } else {
    gsap.to(identEl, { opacity: 1, y: 0, duration: 0.2 });
    gsap.set(accentBar, { scaleY: 1 });
    gsap.set(ruleEl, { scaleX: 1 });
  }
}

(function init() {
  const injected = loadHFVariables();
  if (injected) spec = Object.assign(spec, injected);
  applySpec(spec, false);
})();

window.addEventListener('message', ({ data }) => {
  if (!data) return;
  if (data.type === 'composition-spec') applySpec(data.spec, data.animate !== false);
});
</script>
</body>
</html>
