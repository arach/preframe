<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Particle Storm — Preframe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: ui-monospace, monospace; }
    #video-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.55; }
    #canvas    { position: absolute; inset: 0; width: 100%; height: 100%; }
    #controls  {
      position: absolute; bottom: 0; left: 0; right: 0; padding: 14px 20px;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
      display: flex; align-items: center; gap: 12px;
    }
    #controls select, #controls button {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.8); border-radius: 4px; padding: 6px 10px;
      font-size: 11px; font-family: inherit; cursor: pointer; outline: none;
    }
    #controls select:hover, #controls button:hover { border-color: rgba(74,222,128,0.4); }
    #play-btn { color: rgba(74,222,128,0.9); border-color: rgba(74,222,128,0.3); min-width: 60px; }
    label { font-size: 10px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.1em; }
    #beat-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(74,222,128,0.3); }
    #beat-dot.on { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
  </style>
</head>
<body>

<video id="video-bg" src="/out/lattices-gesture-recording-loop-v3.mp4" loop playsinline muted></video>
<canvas id="canvas"></canvas>
<audio id="audio" crossorigin="anonymous"></audio>

<div id="controls">
  <button id="play-btn">▶ Play</button>
  <div id="beat-dot"></div>
  <label>Track</label>
  <select id="track-select"></select>
</div>

<script>
const video   = document.getElementById('video-bg');
const canvas  = document.getElementById('canvas');
const ctx     = canvas.getContext('2d');
const audioEl = document.getElementById('audio');
const playBtn = document.getElementById('play-btn');
const trackSel= document.getElementById('track-select');
const beatDot = document.getElementById('beat-dot');

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize(); window.addEventListener('resize', resize);

// ── Particle system ──────────────────────────────────────────────────────────
const COLORS = ['#4ade80','#22d3ee','#ffffff','#a3e635','#86efac'];
const particles = [];

class Particle {
  constructor(x, y, vx, vy, size, color, life) {
    Object.assign(this, { x, y, vx, vy, size, color, life, maxLife: life });
  }
  update() {
    this.vy += 0.12; // gravity
    this.vx *= 0.98;
    this.vy *= 0.98;
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
  }
  draw() {
    const alpha = (this.life / this.maxLife) ** 1.4;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = this.size * 3;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * alpha, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function burst(x, y, count, speed, size, life) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const s = speed * (0.3 + Math.random() * 0.7);
    particles.push(new Particle(
      x + (Math.random() - 0.5) * 20,
      y + (Math.random() - 0.5) * 20,
      Math.cos(angle) * s, Math.sin(angle) * s,
      size * (0.3 + Math.random()),
      COLORS[Math.floor(Math.random() * COLORS.length)],
      life + Math.random() * 20 | 0
    ));
  }
}

function beatSpray(amp, bass) {
  // Spray from edges — top, sides
  const w = canvas.width, h = canvas.height;
  const count = 15 + (bass * 25) | 0;
  const spd   = 3 + bass * 5;
  const side  = Math.random() < 0.5 ? 0 : w;
  burst(side, Math.random() * h, count, spd, 3, 60);
  // Small central sparkle
  burst(w / 2 + (Math.random() - 0.5) * 400, h * 0.4 + (Math.random() - 0.5) * 200, 8, spd * 0.6, 2, 40);
}

function dropExplosion() {
  const w = canvas.width, h = canvas.height;
  burst(w / 2, h / 2, 300, 18, 5, 110);   // center explosion
  burst(w / 2, h / 2, 150, 8,  2, 80);    // smaller fast particles
  // Corner bursts
  [[0,0],[w,0],[0,h],[w,h]].forEach(([x,y]) => burst(x, y, 60, 14, 4, 90));
}

// ── Web Audio ─────────────────────────────────────────────────────────────────
let audioCtx, analyser, source, freqData;
let playing = false, beatThreshold = 0.35, prevAmp = 0, lastBeat = 0, lastDrop = 0;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.8;
  source = audioCtx.createMediaElementSource(audioEl);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
  freqData = new Uint8Array(analyser.frequencyBinCount);
}

function energy(lo, hi) {
  let s = 0;
  for (let i = lo; i < hi && i < freqData.length; i++) s += freqData[i];
  return s / ((hi - lo) * 255);
}

// ── Render loop ───────────────────────────────────────────────────────────────
let frame = 0;
function tick() {
  requestAnimationFrame(tick);
  const w = canvas.width, h = canvas.height;

  // Fade trail
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(0, 0, w, h);

  if (playing && analyser) {
    analyser.getByteFrequencyData(freqData);
    const bass = energy(1, 6), amp = energy(0, freqData.length);
    beatThreshold += (amp * 1.5 - beatThreshold) * 0.02;
    const now = Date.now();
    const beat = bass > beatThreshold && now - lastBeat > 180;
    const drop = amp > 0.5 && prevAmp < 0.2 && now - lastDrop > 400;
    if (beat) { lastBeat = now; beatSpray(amp, bass); beatDot.classList.add('on'); setTimeout(() => beatDot.classList.remove('on'), 80); }
    if (drop) { lastDrop = now; dropExplosion(); }
    prevAmp = amp;

    // Ambient bass shimmer — continuous trickle
    if (frame % 3 === 0 && bass > 0.1) {
      burst(Math.random() * w, Math.random() * h, 3, bass * 2, 1.5, 30);
    }
  }

  // Update & draw particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw();
    if (particles[i].life <= 0) particles.splice(i, 1);
  }
  frame++;
}
tick();

// ── Controls ──────────────────────────────────────────────────────────────────
const _urlTrack = new URLSearchParams(location.search).get('track');
fetch('/catalog-data.json').then(r => r.json()).then(d => {
  (d.audioAssets || []).forEach(a => {
    const o = document.createElement('option');
    o.value = '/' + a.path;
    o.textContent = a.songTitle || a.id;
    if (_urlTrack) {
      if (a.id === _urlTrack || a.path.includes(_urlTrack)) o.selected = true;
    } else {
      if (a.id.includes('ref-adrian-quesada') || a.id.includes('47-jaar') || a.id.includes('dark-808') || a.id.includes('03-dark')) o.selected = true;
    }
    trackSel.appendChild(o);
  });
  if (d.audioAssets?.length) audioEl.src = trackSel.value;
});

playBtn.addEventListener('click', () => {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  playing = !playing;
  playing ? (audioEl.play(), video.play()) : (audioEl.pause(), video.pause());
  playBtn.textContent = playing ? '⏸ Pause' : '▶ Play';
});
trackSel.addEventListener('change', () => { audioEl.src = trackSel.value; if (playing) audioEl.play(); });
</script>
</body>
</html>
