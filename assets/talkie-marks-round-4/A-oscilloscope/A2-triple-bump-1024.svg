<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- A2 triple-bump: three peaks evoking the "tal-kie" rhythm.
       Hot Mic dot trails as the endpoint cursor. -->
  <rect width="1024" height="1024" fill="#0E0D0A"/>
  <path
    d="M 144 512
       Q 240 512, 272 432
       Q 304 352, 336 432
       Q 368 512, 416 512
       Q 464 512, 496 400
       Q 528 288, 560 400
       Q 592 512, 640 512
       Q 688 512, 720 456
       Q 752 400, 784 456
       Q 816 512, 880 512"
    fill="none"
    stroke="#F4EFE6"
    stroke-width="36"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="880" cy="512" r="44" fill="#FF5346"/>
</svg>
