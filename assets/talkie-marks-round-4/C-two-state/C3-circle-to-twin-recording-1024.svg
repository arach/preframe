<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- C3 recording: the circle has split into twin reels at ~70% radius each.
       Mass-conservation: less mass per dot, but two dots. Hot Mic on the right. -->
  <rect width="1024" height="1024" fill="#0E0D0A"/>
  <circle cx="336" cy="512" r="160" fill="#F4EFE6"/>
  <circle cx="688" cy="512" r="160" fill="#F4EFE6"/>
  <!-- Hot Mic core in the right reel, suggesting "this side is the live source" -->
  <circle cx="688" cy="512" r="60" fill="#FF5346"/>
</svg>
