<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- C2 recording: dot extrudes into an oscilloscope line — same dot,
       now stretched horizontally with rhythm. Hot Mic dot anchors the right edge. -->
  <rect width="1024" height="1024" fill="#0E0D0A"/>
  <path
    d="M 144 512
       Q 256 512, 304 432
       Q 352 352, 400 512
       Q 448 672, 496 432
       Q 544 192, 592 512
       Q 640 832, 688 512
       Q 736 192, 784 512"
    fill="none"
    stroke="#F4EFE6"
    stroke-width="44"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="864" cy="512" r="60" fill="#FF5346"/>
</svg>
